.update-bar{position:fixed;top:0;left:0;right:0;z-index:997;background:#064e3b;color:#6ee7b7;font-size:13px;font-weight:500;text-align:center;padding:7px 12px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid #065f46;}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useReducer} = React;

// ── CONFIG ────────────────────────────────────────────────────────────────────
// Set this to your deployed backend URL (Railway / Render / VPS)
// e.g. "https://inspectpro-api.railway.app"
const API_BASE = window.INSPECTPRO_API || "https://inspectpro-api.onrender.com";

const VERSION = "v5.4.1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const isAdminRole = role => role === "admin";
const isManagerRole = role => role === "manager" || role === "admin";
const canManageConfig = user => isAdminRole(user?.role);
const canManageOps = user => isManagerRole(user?.role);
const canInspect = user => ["inspector","manager","admin"].includes(user?.role);
const rosterPeople = users => [...users].sort((a,b)=>{
  const r={inspector:0,manager:1,admin:2};
  return (r[a.role]??0)-(r[b.role]??0)||a.name.localeCompare(b.name);
});
const weekSlots = rosterData => rosterData?.Week || rosterData?.Any || [];
const assignmentSlots = (rosterData, day) => [...weekSlots(rosterData), ...(rosterData?.[day] || [])];
const completionKey = (userId, zoneId) => `${userId}|${zoneId}`;

// ── UTILS ─────────────────────────────────────────────────────────────────────
const isoWk = d=>{const dd=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=dd.getUTCDay()||7;dd.setUTCDate(dd.getUTCDate()+4-day);const y1=new Date(Date.UTC(dd.getUTCFullYear(),0,1));return{week:Math.ceil(((dd-y1)/86400000+1)/7),year:dd.getUTCFullYear()};};
const wkKey  = d=>{const{week,year}=isoWk(d);return`${year}-W${String(week).padStart(2,"0")}`;};
const dowN   = d=>DAYS[(new Date(d).getDay()||7)-1];
const getMon = d=>{const dd=new Date(d);const day=dd.getDay()||7;dd.setDate(dd.getDate()-day+1);dd.setHours(0,0,0,0);return dd;};
const fT     = ts=>new Date(ts).toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit",hour12:false});
const fD     = ts=>new Date(ts).toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"});
const fS     = d=>`${d.getDate()}/${d.getMonth()+1}`;
const fDur   = ms=>{const m=Math.round(ms/60000);return`${Math.floor(m/60)}h ${m%60}m`;};
const uid    = ()=>Math.random().toString(36).substr(2,9).toUpperCase();
// Returns first name if unique in the team, full name if another user shares that first name
const displayName=(user,allUsers)=>{
  const first=(user?.name||"").split(" ")[0];
  const collides=(allUsers||[]).some(u=>u.id!==user?.id&&u.name.split(" ")[0]===first);
  return collides?user.name:first;
};
// Role-based chip colours used consistently across login, roster, and home views
const roleChipStyle=role=>{
  if(role==="admin")   return{background:"var(--abg)",color:"var(--amber)",border:"none"};
  if(role==="manager") return{background:"var(--bbg)",color:"var(--blue)",border:"none"};
  return                    {background:"#e5e7eb",color:"#374151",border:"none"};
};
const roleGroupHeader=role=>{
  if(role==="admin")   return{background:"var(--abg)",border:"1px solid rgba(180,83,9,.25)",color:"var(--amber)"};
  if(role==="manager") return{background:"var(--bbg)",border:"1px solid rgba(59,130,246,.25)",color:"var(--blue)"};
  return                    {background:"var(--card2)",border:"1px solid var(--bd)",color:"var(--t3)"};
};

// Simple debounce hook — returns a debounced version of value after `delay` ms
function useDebounce(value, delay){
  const [debouncedValue, setDebouncedValue] = useState(value);
  useEffect(()=>{
    const timer = setTimeout(()=>setDebouncedValue(value), delay);
    return ()=>clearTimeout(timer);
  },[value, delay]);
  return debouncedValue;
}
const LS     = {load:k=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch{return null;}},save:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};

// ── SERVER WAKE-UP TRACKER ────────────────────────────────────────────────────
// Render (free tier) spins down after inactivity. When a request takes >3 s,
// show a friendly banner so users know the server is cold-starting — not broken.
let _wakingCount = 0;
function _startWakeTimer(){
  let fired = false;
  const timer = setTimeout(()=>{
    fired = true;
    _wakingCount++;
    if(_wakingCount === 1) window.dispatchEvent(new CustomEvent("ip_server_waking"));
  }, 3000);
  return {
    cancel(){
      clearTimeout(timer);
      if(fired){
        _wakingCount = Math.max(0, _wakingCount - 1);
        if(_wakingCount === 0) window.dispatchEvent(new CustomEvent("ip_server_ready"));
      }
    }
  };
}

// ── API CLIENT ────────────────────────────────────────────────────────────────
const api = {
  _token: ()=>LS.load("ip_v4_token")||"",
  _authExpiredNotified: false,

  async req(method, path, body, opts={}){
    const wakeTimer = _startWakeTimer();
    const headers = {"Content-Type":"application/json"};
    const token = this._token();
    if(token) headers["Authorization"] = `Bearer ${token}`;
    try{
      const res = await fetch(`${API_BASE}${path}`,{
        method, headers,
        body: body ? JSON.stringify(body) : undefined,
        signal: opts.signal,
      });
      wakeTimer.cancel();
      const data = await res.json();
      if(!res.ok){
        if(res.status===401&&token&&!this._authExpiredNotified){
          this._authExpiredNotified=true;
          window.dispatchEvent(new CustomEvent("ip_auth_expired"));
        }
        throw Object.assign(new Error(data.error||"Request failed"),{status:res.status,data});
      }
      return data;
    }catch(e){
      wakeTimer.cancel();
      if(e.name==="AbortError") throw e;
      throw e;
    }
  },
  get:    (path,opts)=>api.req("GET",path,null,opts),
  post:   (path,body,opts)=>api.req("POST",path,body,opts),
  put:    (path,body,opts)=>api.req("PUT",path,body,opts),
  patch:  (path,body,opts)=>api.req("PATCH",path,body,opts),
  delete: (path,opts)=>api.req("DELETE",path,null,opts),
  resetAuthExpired: ()=>{api._authExpiredNotified=false;},
  async uploadForm(path, form, opts={}){
    const wakeTimer = _startWakeTimer();
    const headers = {};
    const token = this._token();
    if(token) headers["Authorization"] = `Bearer ${token}`;
    try{
      const res = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers,
        body: form,
        signal: opts.signal,
      });
      wakeTimer.cancel();
      const text = await res.text();
      const data = text ? (()=>{try{return JSON.parse(text);}catch{return {error:text};}})() : {};
      if(!res.ok) throw Object.assign(new Error(data.error||"Upload failed"), {status:res.status,data});
      return data;
    }catch(e){
      wakeTimer.cancel();
      throw e;
    }
  },
};

// ── IMAGEKIT UPLOAD ───────────────────────────────────────────────────────────
async function uploadToImageKit(file, folder="inspectpro"){
  const form = new FormData();
  form.append("file", file);
  form.append("folder", folder);
  return await api.uploadForm("/api/media/upload", form); // {fileId, url, thumbnailUrl, size, name, ...}
}


// ── EMAIL (client-side via EmailJS) ──────────────────────────────────────────
// v4: photos already on ImageKit CDN — embed as <img src="url"> in email HTML.
// No base64 compression needed. Videos remain "view in app" only.
async function buildEmailContent(rec, users, zones) {
  const inspector = users.find(u => u.id === (rec.user_id||rec.userId));
  const zoneObj   = zones.find(z => z.id === (rec.zone_id||rec.zoneId));
  const zoneName  = zoneObj?.name || rec.zone_name || '–';
  const items     = rec.items || [];
  const flagged   = items.filter(i => i.status === 'flagged');
  const okCount   = items.filter(i => i.status === 'ok').length;
  const startTs   = rec.start_time || rec.startTime;
  const endTs     = rec.end_time   || rec.endTime;
  const dur       = endTs ? fDur(new Date(endTs) - new Date(startTs)) : '–';
  const zoneId    = rec.zone_id || rec.zoneId;

  // Plain text
  const lines = [
    'INSPECTPRO – INSPECTION REPORT',
    '================================',
    `Inspector : ${inspector?.name || '–'}`,
    `Zone      : ${zoneId} · ${zoneName}`,
    `Date      : ${fD(startTs)}`,
    `Time      : ${fT(startTs)} – ${endTs ? fT(endTs) : '–'}`,
    `Duration  : ${dur}`,
    `Items OK  : ${okCount}`,
    `Flagged   : ${flagged.length}`,
    '',
  ];
  if (flagged.length > 0) {
    lines.push('FLAGGED ITEMS', '─────────────');
    flagged.forEach((f, i) => {
      lines.push(`${i + 1}. ${f.label}`);
      if (f.observation) lines.push(`   → ${f.observation}`);
      const nPhotos = (f.media || []).filter(m => m.type === 'photo').length;
      const nVids   = (f.media || []).filter(m => m.type === 'video').length;
      if (nPhotos) lines.push(`   📷 ${nPhotos} photo${nPhotos>1?'s':''}`);
      if (nVids)   lines.push(`   🎥 ${nVids} video${nVids>1?'s':''} (view in app)`);
      lines.push('');
    });
  }
  lines.push('ALL ITEMS');
  items.forEach(item => {
    const icon = item.status==='ok' ? '✓' : item.status==='flagged' ? '!' : '–';
    const obs  = item.observation ? ` → ${item.observation}` : '';
    lines.push(`  [${icon}] ${item.label}${obs}`);
  });
  lines.push('', 'InspectPro '+VERSION+' · Property Inspection Management');
  const plainText = lines.join('\n');

  // HTML email
  const statusColor = flagged.length > 0 ? '#dc2626' : '#059669';
  const statusBg    = flagged.length > 0 ? '#fee2e2' : '#d1fae5';
  const statusLabel = flagged.length > 0
    ? `⚠ ${flagged.length} item${flagged.length>1?'s':''} flagged`
    : '✓ All clear';

  const flaggedHtml = flagged.map((f, fi) => {
    const photos = (f.media||[]).filter(m => m.type==='photo');
    const nVids  = (f.media||[]).filter(m => m.type==='video').length;
    const border = fi < flagged.length-1 ? 'border-bottom:1px solid #fecaca;' : '';
    const photoImgs = photos.map(p =>
      p.url ? `<img src="${p.thumbnail_url||p.url}" width="60" height="60" style="object-fit:cover;border-radius:5px;border:1px solid #fca5a5;margin-right:5px;" alt=""/>` : ''
    ).join('');
    return `<div style="padding:10px 14px;${border}">
      <div style="font-size:13px;font-weight:700;color:#0d1b2e;${f.observation?'margin-bottom:5px;':''}">${f.label}</div>
      ${f.observation ? `<div style="font-size:12px;color:#374151;background:#fff;border-left:3px solid #dc2626;padding:5px 9px;border-radius:0 4px 4px 0;margin-bottom:7px;">${f.observation}</div>` : ''}
      ${photos.length > 0 ? `<div style="margin-top:5px;">${photoImgs}</div>` : ''}
      ${nVids > 0 ? `<div style="margin-top:5px;font-size:11px;color:#6b7280;background:#f3f4f6;padding:3px 7px;border-radius:4px;display:inline-block;">🎥 ${nVids} video${nVids>1?'s':''} (view in app)</div>` : ''}
    </div>`;
  }).join('');

  const checklistHtml = items.map(item => {
    const dot = item.status==='flagged'?'#dc2626':item.status==='ok'?'#059669':'#d1d5db';
    const bg  = item.status==='flagged'?'#fef2f2':item.status==='ok'?'#f0fdf4':'#fff';
    const obsHtml = item.observation
      ? `<div style="color:#9ca3af;font-size:11px;margin-top:2px;font-style:italic;">${item.observation}</div>` : '';
    return `<div style="display:flex;align-items:flex-start;padding:6px 12px;background:${bg};border-bottom:1px solid #f3f4f6;">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot};margin-top:4px;margin-right:9px;flex-shrink:0;"></span>
      <div style="font-size:12px;color:#374151;">${item.label}${obsHtml}</div>
    </div>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:20px 0;">
<tr><td align="center">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
  <tr><td style="background:#0d1b2e;padding:20px 24px;">
    <table width="100%" cellpadding="0" cellspacing="0"><tr>
      <td><span style="font-size:20px;font-weight:700;color:#fff;">Inspect<span style="color:#f59e0b;">Pro</span> <span style="font-size:12px;color:#8ea0b8;">${VERSION}</span></span></td>
      <td align="right"><span style="font-size:12px;color:#8ea0b8;">Inspection Report</span></td>
    </tr></table>
  </td></tr>
  <tr><td style="background:${statusBg};padding:10px 24px;border-bottom:1px solid #e5e7eb;">
    <span style="font-size:14px;font-weight:700;color:${statusColor};">${statusLabel}</span>
    <span style="font-size:12px;color:#6b7280;margin-left:14px;">${fD(startTs)}</span>
  </td></tr>
  <tr><td style="padding:18px 24px 10px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;">
      <tr><td style="padding:5px 0;color:#6b7280;width:100px;border-bottom:1px solid #f3f4f6;">Inspector</td><td style="padding:5px 0;font-weight:700;color:#0d1b2e;border-bottom:1px solid #f3f4f6;">${inspector?.name||'–'}</td></tr>
      <tr><td style="padding:5px 0;color:#6b7280;border-bottom:1px solid #f3f4f6;">Zone</td><td style="padding:5px 0;color:#0d1b2e;border-bottom:1px solid #f3f4f6;">${zoneId} · ${zoneName}</td></tr>
      <tr><td style="padding:5px 0;color:#6b7280;border-bottom:1px solid #f3f4f6;">Time</td><td style="padding:5px 0;color:#0d1b2e;border-bottom:1px solid #f3f4f6;">${fT(startTs)}–${endTs?fT(endTs):'–'} (${dur})</td></tr>
      <tr><td style="padding:5px 0;color:#6b7280;border-bottom:1px solid #f3f4f6;">Items OK</td><td style="padding:5px 0;font-weight:700;color:#059669;border-bottom:1px solid #f3f4f6;">${okCount}</td></tr>
      <tr><td style="padding:5px 0;color:#6b7280;">Flagged</td><td style="padding:5px 0;font-weight:700;color:${statusColor};">${flagged.length}</td></tr>
    </table>
  </td></tr>
  ${flagged.length > 0 ? `<tr><td style="padding:0 24px 16px;">
    <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;overflow:hidden;">
      <div style="background:#fee2e2;padding:9px 14px;border-bottom:1px solid #fca5a5;">
        <span style="font-size:13px;font-weight:700;color:#dc2626;">⚠ Flagged Items</span>
      </div>
      ${flaggedHtml}
    </div>
  </td></tr>` : ''}
  <tr><td style="padding:0 24px 20px;">
    <div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;">Full Checklist</div>
    ${checklistHtml}
  </td></tr>
  <tr><td style="background:#f9fafb;padding:12px 24px;border-top:1px solid #e5e7eb;text-align:center;">
    <span style="font-size:11px;color:#9ca3af;">InspectPro ${VERSION} · ${fD(startTs)}</span>
  </td></tr>
</table>
</td></tr></table>
</body></html>`;

  return { html, plainText };
}

async function sendEmail(to, name, subj, content, cfg={}) {
  const publicKey  = cfg.ejPublicKey  || cfg.publicKey  || '';
  const serviceId  = cfg.ejServiceId  || cfg.serviceId  || '';
  const templateId = cfg.ejTemplateId || cfg.templateId || '';
  if (!publicKey) {
    console.log('Email simulated (no EmailJS config) →', to);
    return { ok: false, sim: true };
  }
  try {
    if (typeof emailjs === 'undefined') throw new Error('EmailJS library not loaded');
    emailjs.init(publicKey);
    await emailjs.send(serviceId, templateId, {
      to_email:  to,
      to_name:   name,
      subject:   subj,
      message:   content.plainText,
      body_html: content.html,
    });
    return { ok: true };
  } catch(e) {
    return { ok: false, err: e.message };
  }
}

async function sendTelegram(text, cfg={}) {
  const token = cfg.tgBotToken || cfg.botToken || '';
  const chat  = cfg.tgChatId   || cfg.chatId   || '';
  if (!token || !chat) { console.log('Telegram not configured'); return {ok:false,sim:true}; }
  try {
    const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chat, text, parse_mode: 'HTML'}),
    });
    const json = await res.json();
    return {ok: json.ok, err: json.description};
  } catch(e) { return {ok: false, err: e.message}; }
}

async function notifyTelegram(subject, body, cfg) {
  return sendTelegram(`<b>${subject}</b>\n\n${body}`, cfg);
}

// Full-screen photo/video viewer. Photos use CDN url, videos use CDN url.
function Lightbox({items, startIdx=0, onClose}) {
  const [idx,setIdx] = useState(startIdx);
  const item = items[idx];
  const prev = () => setIdx(i => (i-1+items.length)%items.length);
  const next = () => setIdx(i => (i+1)%items.length);
  useEffect(()=>{
    const h=e=>{
      if(e.key==="Escape")  onClose();
      if(e.key==="ArrowLeft")  prev();
      if(e.key==="ArrowRight") next();
    };
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[idx]);

  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{position:"absolute",top:16,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,.6)",color:"#fff",fontSize:13,padding:"4px 12px",borderRadius:20,pointerEvents:"none"}}>
      {idx+1} / {items.length}
    </div>
    <button onClick={onClose} style={{position:"absolute",top:14,right:16,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",fontSize:22,cursor:"pointer",borderRadius:8,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",zIndex:1}}>✕</button>
    {items.length>1&&<button onClick={e=>{e.stopPropagation();prev();}} style={{position:"absolute",left:12,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",fontSize:22,cursor:"pointer",borderRadius:8,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>}
    <div onClick={e=>e.stopPropagation()} style={{maxWidth:"95vw",maxHeight:"88vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      {item?.type==="photo"
        ? <img src={item.url} style={{maxWidth:"90vw",maxHeight:"85vh",borderRadius:8,objectFit:"contain",boxShadow:"0 8px 40px rgba(0,0,0,.6)"}} alt=""/>
        : <video src={item.url} controls autoPlay playsInline style={{maxWidth:"90vw",maxHeight:"85vh",borderRadius:8,background:"#000"}}/>
      }
    </div>
    {item?.caption&&<div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,.7)",color:"#fff",fontSize:13,padding:"6px 14px",borderRadius:20,maxWidth:"80vw",textAlign:"center",pointerEvents:"none"}}>{item.caption}</div>}
    {items.length>1&&<button onClick={e=>{e.stopPropagation();next();}} style={{position:"absolute",right:12,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",fontSize:22,cursor:"pointer",borderRadius:8,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>}
  </div>;
}

// ── AUTO-PLAN MODAL ───────────────────────────────────────────────────────────
function AutoPlanModal({users,zones,onClose,today,onApplied}) {
  const inspectors = users.filter(u=>u.role==="inspector").sort((a,b)=>a.name.localeCompare(b.name));
  const managers   = users.filter(u=>u.role==="manager"||u.role==="admin").sort((a,b)=>a.name.localeCompare(b.name));
  const [startDate,setStartDate] = useState(()=>{
    const d=getMon(today);d.setDate(d.getDate()+7);return d.toISOString().split("T")[0];
  });
  const weeksLeft = Math.max(1, Math.ceil((new Date(today.getFullYear(),11,28) - getMon(today)) / (7*86400000)));
  const [numWeeks,setNumWeeks] = useState(weeksLeft);
  const [selInsp,setSelInsp]   = useState(inspectors.map(u=>u.id));
  const [selMgr,setSelMgr]     = useState(managers.map(u=>u.id));
  const [selZones,setSelZones]  = useState(zones.slice(0,5).map(z=>z.id));
  const [preview,setPreview]   = useState(null);
  const [saving,setSaving]     = useState(false);
  const [done,setDone]         = useState(false);
  const [err,setErr]           = useState("");
  const toggleArr=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];

  const generate=()=>{
    if(!selInsp.length||!selZones.length) return;
    const plan={};
    const start=getMon(new Date(startDate+"T00:00:00"));
    const nZ=selZones.length;
    // Carry-forward: unused inspectors (after nZ assigned) move to front of queue next week
    let inspQ=[...selInsp];
    const mgrPairSz=2;
    const numPairs=Math.max(1,Math.ceil(selMgr.length/mgrPairSz));
    for(let w=0;w<numWeeks;w++){
      const d=new Date(start);d.setDate(d.getDate()+w*7);
      const wk=wkKey(d);
      // Assign first nZ from queue; rotate unused to front for next week
      const thisInsp=inspQ.slice(0,nZ);
      inspQ=[...inspQ.slice(nZ),...inspQ.slice(0,nZ)];
      // Bi-weekly manager pairs: same pair for 2 consecutive weeks
      const pairIdx=Math.floor(w/2)%numPairs;
      const thisMgrs=selMgr.slice(pairIdx*mgrPairSz,(pairIdx+1)*mgrPairSz);
      // Randomly assign each manager to one zone (only 2 zones get a manager this week)
      const shuffled=[...selZones].sort(()=>Math.random()-.5);
      const mgrZoneMap={};
      thisMgrs.forEach((mId,mi)=>{if(shuffled[mi]) mgrZoneMap[shuffled[mi]]=mId;});
      const weekSlots=selZones.map((zoneId,zIdx)=>({
        zoneId,
        inspectorIds:thisInsp[zIdx]?[thisInsp[zIdx]]:[],
        supervisorIds:mgrZoneMap[zoneId]?[mgrZoneMap[zoneId]]:[],
      }));
      plan[wk]={Week:weekSlots};
    }
    setPreview(plan);
  };

  const apply=async()=>{
    if(!preview) return;
    setSaving(true);setErr("");
    try{
      for(const [weekKey,wkData] of Object.entries(preview)){
        const slots=[];
        for(const [day,daySlots] of Object.entries(wkData)){
          for(const s of daySlots) slots.push({day,...s});
        }
        await api.put("/api/roster",{weekKey,slots});
      }
      setDone(true);
      onApplied?.();
    }catch(e){setErr("Save failed: "+e.message);}
    setSaving(false);
  };

  return <Modal onClose={onClose} title="⚡ Auto-Plan Roster" maxW={560}>
    {done
      ?<div style={{textAlign:"center",padding:"24px 0"}}>
        <div style={{fontSize:36,marginBottom:12}}>✅</div>
        <div style={{fontWeight:600,fontSize:16,color:"var(--t1)",marginBottom:6}}>Plan applied!</div>
        <p style={{fontSize:15,color:"var(--t2)",marginBottom:20}}>{numWeeks} wks · {selInsp.length} inspectors across {selZones.length} zones · {selMgr.length} managers (bi-weekly).</p>
        <button onClick={onClose} style={C.btn("pri",{padding:"10px 24px"})}>Done</button>
      </div>
      :<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div><Lbl>Starting Week</Lbl><input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={C.inp()}/></div>
          <div><Lbl>Duration</Lbl>
            <select value={numWeeks} onChange={e=>setNumWeeks(Number(e.target.value))} style={C.inp()}>
              {[4,8,12,26,weeksLeft].filter((n,i,a)=>n>0&&a.indexOf(n)===i).map(n=><option key={n} value={n}>{n} wk{n===weeksLeft?" (rest of yr)":n===4?" (1 mo)":n===12?" (3 mo)":n===26?" (6 mo)":""}</option>)}
            </select>
          </div>
        </div>
        <div style={{background:"var(--card2)",border:"1px solid var(--bd)",borderRadius:8,padding:"10px 13px",marginBottom:14,fontSize:13,color:"var(--t2)",lineHeight:1.6}}>
          <span style={{color:"var(--t1)",fontWeight:600}}>Inspector rotation:</span> {selInsp.length} inspectors cover {selZones.length} zones/wk — the {Math.max(0,selInsp.length-selZones.length)} unused carry forward as priority next week.<br/>
          <span style={{color:"var(--blue)",fontWeight:600}}>Manager rotation:</span> {selMgr.length} managers split into pairs of 2, each pair assigned as supervisors for 2 consecutive weeks.
        </div>

        <Lbl>Inspectors ({selInsp.length} selected)</Lbl>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}}>
          {inspectors.map(u=><label key={u.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:selInsp.includes(u.id)?"var(--surf)":"var(--card2)",border:`1px solid ${selInsp.includes(u.id)?"var(--bd2)":"var(--bd)"}`,borderRadius:20,cursor:"pointer"}}>
            <input type="checkbox" checked={selInsp.includes(u.id)} onChange={()=>setSelInsp(a=>toggleArr(a,u.id))} style={{accentColor:"var(--t2)",width:13,height:13}}/>
            <Avatar user={u} size={20}/>
            <span style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{displayName(u,inspectors)}</span>
          </label>)}
        </div>

        <Lbl>Managers ({selMgr.length} selected — bi-weekly, 2 per week)</Lbl>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}}>
          {managers.map(u=><label key={u.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:selMgr.includes(u.id)?"var(--bbg)":"var(--card2)",border:`1px solid ${selMgr.includes(u.id)?"var(--blue)":"var(--bd)"}`,borderRadius:20,cursor:"pointer"}}>
            <input type="checkbox" checked={selMgr.includes(u.id)} onChange={()=>setSelMgr(a=>toggleArr(a,u.id))} style={{accentColor:"var(--blue)",width:13,height:13}}/>
            <Avatar user={u} size={20}/>
            <span style={{fontSize:13,fontWeight:600,color:"var(--blue)"}}>{displayName(u,managers)}</span>
          </label>)}
        </div>

        <Lbl>Zones ({selZones.length} selected)</Lbl>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
          {zones.map(z=><button key={z.id} onClick={()=>setSelZones(a=>toggleArr(a,z.id))} style={{...C.btn(selZones.includes(z.id)?"pri":"ghost",{padding:"5px 9px",fontSize:12})}}>{z.id}</button>)}
        </div>

        {preview&&<div style={{background:"var(--gbg)",border:"1px solid var(--green)33",borderRadius:8,padding:"12px 14px",marginBottom:14,fontSize:13}}>
          <div style={{fontWeight:700,color:"var(--t1)",marginBottom:10}}>✓ Preview — {Object.keys(preview).length} weeks</div>
          <div style={{maxHeight:240,overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>
            {Object.entries(preview).map(([wk,wkData])=>{
              const slots=wkData.Week||[];
              return <div key={wk}>
                <Mono size={11} style={{background:"var(--surf)",padding:"2px 7px",borderRadius:5,display:"inline-block",marginBottom:4}}>{wk}</Mono>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {slots.map((s,i)=>{
                    const insp=users.find(uu=>uu.id===s.inspectorIds?.[0]);
                    const supv=users.find(uu=>uu.id===s.supervisorIds?.[0]);
                    return <div key={i} style={{display:"flex",alignItems:"center",gap:4,background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:6,padding:"3px 8px 3px 4px"}}>
                      <Mono size={11} color="var(--blue)" style={{background:"var(--bbg)",padding:"1px 4px",borderRadius:3,flexShrink:0}}>{s.zoneId}</Mono>
                      {insp&&<><Avatar user={insp} size={16}/><span style={{fontSize:11,color:"var(--t1)"}}>{displayName(insp,users)}</span></>}
                      {supv&&<><span style={{fontSize:10,color:"var(--t3)",margin:"0 2px"}}>/</span><span style={{fontSize:10,color:"var(--blue)"}}>{displayName(supv,users)}</span></>}
                    </div>;
                  })}
                </div>
              </div>;
            })}
          </div>
        </div>}
        {err&&<ErrBox msg={err}/>}
        <div style={{display:"flex",gap:9,justifyContent:"flex-end",flexWrap:"wrap"}}>
          <button onClick={onClose} style={C.btn("ghost")}>Cancel</button>
          {!preview
            ?<button onClick={generate} disabled={!selInsp.length||!selZones.length} style={{...C.btn("sec",{padding:"9px 18px"}),opacity:(selInsp.length&&selZones.length)?1:.35}}>Preview →</button>
            :<><button onClick={()=>setPreview(null)} style={C.btn("sec",{padding:"9px 16px"})}>Re-configure</button>
              <button onClick={apply} disabled={saving} style={{...C.btn("pri",{padding:"9px 20px",display:"flex",alignItems:"center",gap:7}),opacity:saving?0.6:1}}>
                {saving?<><Spinner size={13}/>Saving…</>:"✓ Apply Plan"}
              </button>
            </>
          }
        </div>
      </>
    }
  </Modal>;
}

// ── TOAST SYSTEM ──────────────────────────────────────────────────────────────
let _toastId=0;const _toastCbs=[];
function showToast(msg,type="info"){
  const id=++_toastId;
  _toastCbs.forEach(fn=>fn({id,msg,type}));
  setTimeout(()=>_toastCbs.forEach(fn=>fn({id,remove:true})),3500);
}
function ToastHost(){
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{
    const fn=t=>{if(t.remove)setToasts(p=>p.filter(x=>x.id!==t.id));else setToasts(p=>[...p,t]);};
    _toastCbs.push(fn);return()=>{const i=_toastCbs.indexOf(fn);if(i>=0)_toastCbs.splice(i,1);};
  },[]);
  if(!toasts.length)return null;
  return <div style={{position:"fixed",bottom:88,left:"50%",transform:"translateX(-50%)",zIndex:900,display:"flex",flexDirection:"column",gap:6,alignItems:"center",pointerEvents:"none"}}>
    {toasts.map(t=><div key={t.id} style={{background:t.type==="err"?"#dc2626":t.type==="ok"?"#059669":"#1e293b",color:"#fff",padding:"9px 18px",borderRadius:9,fontSize:13,fontWeight:500,boxShadow:"0 4px 14px rgba(0,0,0,.35)",whiteSpace:"nowrap",maxWidth:320,textAlign:"center"}}>{t.msg}</div>)}
  </div>;
}

// ── PIN PAD ───────────────────────────────────────────────────────────────────
function PinPad({onComplete,label,error,digits:extDigits,setDigits:extSet}){
  const [intDigits,intSet]=useState([]);
  const digits=extDigits||intDigits;
  const setDigits=extSet||intSet;
  const press=d=>{
    if(digits.length>=6)return;
    const n=[...digits,d];setDigits(n);
    if(n.length===6)onComplete(n.join(""));
  };
  const del=()=>setDigits(p=>p.slice(0,-1));
  useEffect(()=>{if(error)setDigits([]);},[error]);
  return <div style={{textAlign:"center"}}>
    <div style={{fontSize:14,color:"var(--t2)",marginBottom:16}}>{label}</div>
    <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:20}}>
      {[0,1,2,3,4,5].map(i=><span key={i} className={`pin-dot${i<digits.length?" on":""}`}/>)}
    </div>
    {error&&<div style={{fontSize:13,color:"var(--red)",background:"var(--op-bg)",padding:"6px 12px",borderRadius:7,marginBottom:12}}>{error}</div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,maxWidth:210,margin:"0 auto"}}>
      {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=>
        k===""?<div key={i}/>:
        <button key={i} onClick={()=>k==="⌫"?del():press(String(k))} style={C.btn("sec",{padding:"13px 0",fontSize:18,fontWeight:600,borderRadius:10})}>{k}</button>
      )}
    </div>
  </div>;
}

function LoginModal({users,onLogin,onClose}){
  const loginUsers=[...users].sort((a,b)=>a.name.localeCompare(b.name));
  const [selId,setSelId]=useState("");
  const [step,setStep]=useState("pick");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const user=loginUsers.find(u=>u.id===selId);

  const selectUser=id=>{setSelId(id);setErr("");setStep("pin");};

  const tryPin=async pin=>{
    if(!user)return;
    setLoading(true);setErr("");
    try{
      const res=await api.post("/api/auth/login",{userId:user.id,pin});
      LS.save("ip_v4_token",res.token);
      api.resetAuthExpired();
      onLogin(res.user);
    }catch(e){
      setErr(e.status===401?"Incorrect PIN.":"Server error. Try again.");
    }finally{setLoading(false);}
  };

  // Group users by role for the picker
  const roleGroups=[
    {label:"Admin",    list:loginUsers.filter(u=>u.role==="admin")},
    {label:"Manager",  list:loginUsers.filter(u=>u.role==="manager")},
    {label:"Inspector",list:loginUsers.filter(u=>u.role==="inspector")},
  ].filter(g=>g.list.length>0);

  return <div style={{position:"fixed",inset:0,background:"var(--bg)",display:"flex",flexDirection:"column",zIndex:500,overflowY:"auto"}}>
    {/* Header */}
    <div style={{background:"var(--surf)",borderBottom:"1px solid var(--bd)",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:28,height:28,background:"var(--amber)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:"#fff",fontFamily:"'Syne',sans-serif",flexShrink:0}}>IP</div>
        <div>
          <span style={{fontWeight:700,fontSize:14,color:"var(--t1)",fontFamily:"'Syne',sans-serif",letterSpacing:".02em"}}>Inspect<span style={{color:"var(--amber)"}}>Pro</span></span>
          <Mono size={9} color="var(--t3)" style={{display:"block",letterSpacing:".06em"}}>{VERSION}</Mono>
        </div>
      </div>
      {onClose&&<button onClick={onClose} style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:20}}>✕</button>}
    </div>

    <div style={{flex:1,padding:"16px 14px 24px",maxWidth:480,width:"100%",margin:"0 auto"}}>
      {step==="pick"
        ?<>
          <p style={{fontSize:13,color:"var(--t3)",marginBottom:14,textAlign:"center"}}>Tap your name to continue</p>
          {roleGroups.map(g=>{
            const hdr=roleGroupHeader(g.list[0]?.role);
            return <div key={g.label} style={{marginBottom:10,borderRadius:10,overflow:"hidden",border:hdr.border}}>
              <div style={{background:hdr.background,padding:"5px 12px"}}>
                <span style={{fontSize:10,fontWeight:700,color:hdr.color,textTransform:"uppercase",letterSpacing:".07em",fontFamily:"'DM Mono',monospace"}}>{g.label}</span>
              </div>
              <div style={{background:"var(--card)",padding:"8px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                {g.list.map(u=>{
                  const cs=roleChipStyle(u.role);
                  return <button key={u.id} onClick={()=>selectUser(u.id)}
                    style={{display:"flex",alignItems:"center",gap:8,...cs,borderRadius:8,padding:"8px 10px",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"'DM Sans',sans-serif",transition:"background .15s",minWidth:0}}>
                    <Avatar user={u} size={26}/>
                    <span style={{color:cs.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name}</span>
                  </button>;
                })}
              </div>
            </div>;
          })}
        </>
        :<>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:"var(--surf)",borderRadius:9,border:"1px solid var(--bd)",marginBottom:20}}>
            <Avatar user={user} size={36}/>
            <div style={{flex:1}}><div style={{fontWeight:600,color:"var(--t1)"}}>{user?.name}</div><Mono size={12}>{user?.role?.toUpperCase()} · {user?.id}</Mono></div>
            <button onClick={()=>{setStep("pick");setSelId("");setErr("");}} style={C.btn("ghost",{padding:"4px 9px",fontSize:12})}>Change</button>
          </div>
          {loading?<div style={{textAlign:"center",padding:"20px"}}><Spinner size={24}/></div>
            :<PinPad onComplete={tryPin} label="Enter your 6-digit PIN" error={err}/>}
        </>
      }
    </div>
  </div>;
}

// ── HOME VIEW (includes inline roster) ───────────────────────────────────────
function HomeView({today,authUser,users,zones,nav,isOnline}){
  const [curWeek,setCurWeek]=useState(today);
  const [rosterData,setRosterData]=useState({});
  const [completed,setCompleted]=useState({});
  const [issues,setIssues]=useState([]);
  const [loading,setLoading]=useState(true);
  const [editCell,setEditCell]=useState(null); // {slotId,zoneId} or null
  const [ef,setEf]=useState({inspIds:[],supIds:[],zoneId:""});
  const [showAutoPlan,setShowAutoPlan]=useState(false);
  const canEdit=canManageOps(authUser);

  const wk=wkKey(curWeek);
  const {week,year}=isoWk(curWeek);
  const isThisWeek=wkKey(today)===wk;
  const monday=getMon(curWeek);
  const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
  const fRange=`${monday.getDate()}/${monday.getMonth()+1} – ${sunday.getDate()}/${sunday.getMonth()+1}`;
  const dn=dowN(today);

  const load=useCallback(async()=>{
    if(!authUser)return;
    setLoading(true);
    try{
      const [rd,insp,issuesData]=await Promise.all([
        api.get(`/api/roster?week=${wk}`),
        api.get(`/api/inspections?limit=300`),
        api.get(`/api/issues?status=open&limit=200`),
      ]);
      setRosterData(rd);
      const done={};
      insp.filter(i=>i.end_time&&wkKey(new Date(i.start_time))===wk).forEach(i=>{done[completionKey(i.user_id,i.zone_id)]=i;});
      setCompleted(done);
      setIssues(issuesData);
    }catch(e){console.warn("Home load error:",e);}
    setLoading(false);
  },[wk,authUser?.id]);

  useEffect(()=>{load();},[load]);

  const slots=weekSlots(rosterData);
  const myIssues=issues.filter(i=>i.user_id===authUser?.id||i.inspector_id===authUser?.id);
  const openCount=issues.length;
  const myCount=myIssues.length;

  const toggleId=(arr,id)=>arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];

  const saveSlot=async()=>{
    if(!ef.zoneId)return;
    // Build new slots array: all existing minus the one being edited, plus the new one
    const allSlots=slots.filter(s=>s.id!==editCell?.slotId)
      .map(s=>({day:"Week",zoneId:s.zoneId,inspectorIds:s.inspectorIds||[],supervisorIds:s.supervisorIds||[]}));
    allSlots.push({day:"Week",zoneId:ef.zoneId,inspectorIds:ef.inspIds,supervisorIds:ef.supIds});
    try{await api.put("/api/roster",{weekKey:wk,slots:allSlots});await load();setEditCell(null);}
    catch(e){showToast("Save failed: "+e.message,"err");}
  };

  const deleteSlot=async(slotId)=>{
    const allSlots=slots.filter(s=>s.id!==slotId)
      .map(s=>({day:"Week",zoneId:s.zoneId,inspectorIds:s.inspectorIds||[],supervisorIds:s.supervisorIds||[]}));
    try{await api.put("/api/roster",{weekKey:wk,slots:allSlots});await load();}
    catch(e){showToast("Delete failed: "+e.message,"err");}
  };

  // Build a map of zoneId → slot for quick lookup
  const slotByZone={};
  slots.forEach(s=>{slotByZone[s.zoneId]=s;});

  const people=rosterPeople(users);

  return <div className="fu">
    {/* Header */}
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:16}}>
      <div>
        <Mono size={12} color="var(--t3)" style={{textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:4}}>{fD(today)} · {dn}</Mono>
        <h1 style={{fontSize:26,letterSpacing:"-.02em",marginBottom:4}}>{today.getHours()<12?"Good Morning":"Good Afternoon"} 👋</h1>
      </div>
      <button onClick={()=>nav("inspect")} style={C.btn("pri",{padding:"11px 22px",fontSize:15,display:"flex",alignItems:"center",gap:8})}>▶ Start Inspection</button>
    </div>

    {/* Open Issues — always visible */}
    <div style={{...C.card({marginBottom:14,padding:"14px 18px"}),display:"flex",alignItems:"center",gap:16,cursor:"pointer"}} onClick={()=>nav("tracker")}>
      <div style={{flex:1}}>
        <Mono size={11} color="var(--t3)" style={{textTransform:"uppercase",letterSpacing:".06em",display:"block",marginBottom:4}}>Open Issues</Mono>
        <div style={{display:"flex",alignItems:"baseline",gap:10}}>
          <span style={{fontSize:32,fontWeight:600,color:openCount>0?"var(--red)":"var(--green)",fontFamily:"'DM Mono',monospace"}}>{openCount}</span>
          {openCount>0&&myCount>0&&<span style={{fontSize:13,color:"var(--op-fg)",background:"var(--op-bg)",padding:"2px 10px",borderRadius:20,fontWeight:600}}>{myCount} mine</span>}
          {openCount===0&&<span style={{fontSize:13,color:"var(--cl-fg)",background:"var(--cl-bg)",padding:"2px 10px",borderRadius:20,fontWeight:600}}>All clear</span>}
        </div>
      </div>
      <Mono size={13} color="var(--t3)">→ Tracker</Mono>
    </div>

    {/* Week navigator */}
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,background:"var(--surf)",borderRadius:9,border:"1px solid var(--bd)",padding:"8px 12px"}}>
      <button onClick={()=>setCurWeek(d=>{const dd=new Date(d);dd.setDate(dd.getDate()-7);return dd;})} style={C.btn("ghost",{padding:"4px 10px",fontSize:13})}>←</button>
      <div style={{flex:1,textAlign:"center"}}>
        <span style={{fontWeight:700,fontSize:14,color:"var(--t1)"}}>
          {fRange}&nbsp;&nbsp;
        </span>
        <Mono size={12} color={isThisWeek?"var(--amber)":"var(--t3)"} style={{background:isThisWeek?"var(--abg)":"var(--card2)",padding:"2px 8px",borderRadius:20,textTransform:"uppercase"}}>
          {isThisWeek?"This week":`Wk ${week}`}
        </Mono>
      </div>
      <button onClick={()=>setCurWeek(d=>{const dd=new Date(d);dd.setDate(dd.getDate()+7);return dd;})} style={C.btn("ghost",{padding:"4px 10px",fontSize:13})}>→</button>
    </div>

    {/* Auto-Plan button for managers/admins */}
    {canEdit&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:10,gap:7}}>
      <button onClick={()=>setShowAutoPlan(true)} style={C.btn("sec",{padding:"6px 13px",fontSize:13,display:"flex",alignItems:"center",gap:6})}>⚡ Auto-Plan</button>
    </div>}

    {loading?<div style={{textAlign:"center",padding:"40px"}}><Spinner size={24}/></div>:
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {zones.map(zone=>{
          const s=slotByZone[zone.id];
          const isMySlot=s&&((s.inspectorIds||[]).includes(authUser?.id)||(s.supervisorIds||[]).includes(authUser?.id));
          const inspPeople=(s?.inspectorIds||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
          const supPeople=(s?.supervisorIds||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
          const allAssigned=inspPeople.length>0||supPeople.length>0;

          return <div key={zone.id} style={{background:isMySlot?"var(--cl-bg)":"var(--card)",border:isMySlot?"1px solid rgba(16,185,129,.27)":"1px solid var(--bd)",borderRadius:9,padding:"10px 12px"}}>
            {/* Row 1: zone badge + name + edit/add */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:allAssigned?7:0}}>
              <Mono size={11} color="var(--blue)" style={{background:"var(--bbg)",padding:"3px 7px",borderRadius:5,flexShrink:0}}>{zone.id}</Mono>
              <span style={{flex:1,fontSize:14,fontWeight:700,color:isMySlot?"var(--cl-fg)":"var(--t1)"}}>{zone.name}</span>
              {canEdit&&allAssigned&&<button onClick={()=>{setEf({inspIds:[...(s.inspectorIds||[])],supIds:[...(s.supervisorIds||[])],zoneId:s.zoneId});setEditCell({slotId:s.id,zoneId:s.zoneId});}} style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:15,padding:"0 2px",lineHeight:1}}>✎</button>}
              {canEdit&&!allAssigned&&<button onClick={()=>{setEf({inspIds:[],supIds:[],zoneId:zone.id});setEditCell({slotId:null,zoneId:zone.id});}} style={C.btn("ghost",{padding:"3px 9px",fontSize:12})}>+ Add</button>}
            </div>
            {/* Row 2: chips */}
            {allAssigned&&<div style={{display:"flex",gap:5,flexWrap:"wrap",paddingLeft:2}}>
              {inspPeople.map((u,j)=>{
                const isMe=u.id===authUser?.id;
                const cs=isMe?{background:"var(--cl-bg)",border:"1px solid rgba(16,185,129,.35)",color:"var(--cl-fg)"}:roleChipStyle(u.role);
                return <div key={j} style={{display:"flex",alignItems:"center",gap:4,...cs,borderRadius:20,padding:"4px 9px 4px 4px"}}>
                  <Avatar user={u} size={18}/>
                  <span style={{fontSize:12,fontWeight:600,color:cs.color}}>{displayName(u,users)}</span>
                  {isMe&&<span style={{fontSize:10,fontWeight:700,background:"rgba(16,185,129,.2)",color:"var(--cl-fg)",padding:"1px 5px",borderRadius:10}}>me</span>}
                  {completed[completionKey(u.id,zone.id)]
                    ?<span style={{fontSize:10,fontWeight:700,background:"var(--cl-bg)",color:"var(--cl-fg)",padding:"1px 6px",borderRadius:10}}>Done</span>
                    :<span style={{fontSize:10,fontWeight:700,background:"var(--pd-bg)",color:"var(--pd-fg)",padding:"1px 6px",borderRadius:10}}>Due</span>}
                </div>;
              })}
              {supPeople.map((u,j)=>{
                const isMe=u.id===authUser?.id;
                return <div key={"s"+j} style={{display:"flex",alignItems:"center",gap:4,background:"var(--bbg)",border:"1px solid rgba(59,130,246,.35)",borderRadius:20,padding:"4px 9px 4px 4px"}}>
                  <Avatar user={u} size={18}/>
                  <span style={{fontSize:12,fontWeight:600,color:"var(--blue)"}}>{displayName(u,users)} ★</span>
                  {isMe&&<span style={{fontSize:10,fontWeight:700,background:"rgba(59,130,246,.15)",color:"var(--blue)",padding:"1px 5px",borderRadius:10}}>me</span>}
                </div>;
              })}
            </div>}
          </div>;
        })}
      </div>
    }

    {showAutoPlan&&<AutoPlanModal users={users} zones={zones} onClose={()=>setShowAutoPlan(false)} today={curWeek} onApplied={load}/>}

    {editCell&&<Modal onClose={()=>setEditCell(null)} title={editCell.slotId?"Edit Slot":"Add Slot"} maxW={460}>
      <Lbl>Zone</Lbl>
      <select value={ef.zoneId} onChange={e=>setEf(f=>({...f,zoneId:e.target.value}))} style={C.inp({marginBottom:12})}>
        <option value="">— Select zone —</option>
        {zones.map(z=><option key={z.id} value={z.id}>{z.id} – {z.name}</option>)}
      </select>
      <Lbl>Inspector(s)</Lbl>
      <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
        {people.map(u=><label key={u.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:ef.inspIds.includes(u.id)?"var(--bbg)":"var(--surf)",border:`1px solid ${ef.inspIds.includes(u.id)?"var(--blue)":"var(--bd)"}`,borderRadius:20,cursor:"pointer"}}>
          <input type="checkbox" checked={ef.inspIds.includes(u.id)} onChange={()=>setEf(f=>({...f,inspIds:toggleId(f.inspIds,u.id)}))} style={{accentColor:"var(--blue)"}}/>
          <Avatar user={u} size={18}/><span style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{displayName(u,people)}</span>
        </label>)}
      </div>
      <Lbl>Supervisor (optional)</Lbl>
      <select value={ef.supIds[0]||""} onChange={e=>setEf(f=>({...f,supIds:e.target.value?[e.target.value]:[]}))} style={C.inp({marginBottom:16})}>
        <option value="">None</option>
        {users.filter(u=>isManagerRole(u.role)).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
      </select>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        {editCell.slotId&&<button onClick={()=>deleteSlot(editCell.slotId).then(()=>setEditCell(null))} style={C.btn("dng",{marginRight:"auto"})}>Remove</button>}
        <button onClick={()=>setEditCell(null)} style={C.btn("ghost")}>Cancel</button>
        <button onClick={saveSlot} disabled={!ef.zoneId} style={{...C.btn("pri"),opacity:ef.zoneId?1:.35}}>Save</button>
      </div>
    </Modal>}
  </div>;
}

// ── INSPECT VIEW ──────────────────────────────────────────────────────────────
function InspectView({authUser,zones,users,today,ejConfig,tgConfig}){
  const [step,setStep]=useState("select");
  const [activeInsp,setActiveInsp]=useState(null); // {id, items:[...], zoneId, ...}
  const [sending,setSending]=useState(false);
  const [err,setErr]=useState("");

  const startInspection=async(zoneId)=>{
    setErr("");
    try{
      const insp=await api.post("/api/inspections",{zoneId,startTime:new Date().toISOString()});
      setActiveInsp(insp);
      setStep("zone");
    }catch(e){setErr("Could not start inspection: "+e.message);}
  };

  const updateItem=async(itemId,upd)=>{
    try{
      const updated=await api.patch(`/api/inspections/${activeInsp.id}/item/${itemId}`,upd);
      setActiveInsp(p=>({...p,items:p.items.map(it=>it.id===itemId?{...it,...updated,media:it.media}:it)}));
    }catch(e){console.warn("Item update failed:",e);}
  };

  const addMediaToItem=(itemId,mediaObj)=>{
    setActiveInsp(p=>({...p,items:p.items.map(it=>it.id===itemId?{...it,media:[...(it.media||[]),mediaObj]}:it)}));
  };
  const removeMediaFromItem=(itemId,mediaId)=>{
    setActiveInsp(p=>({...p,items:p.items.map(it=>it.id===itemId?{...it,media:(it.media||[]).filter(m=>m.id!==mediaId)}:it)}));
  };

  const finishZone=()=>setStep("summary");
  const cancelInspection=async()=>{
    if(!await showConfirm("Cancel this inspection? It will remain open and can be resumed later."))return;
    setActiveInsp(null);setStep("select");
  };

  const submitInspection=async()=>{
    setSending(true);setErr("");
    try{
      const endTime=new Date().toISOString();
      await api.put(`/api/inspections/${activeInsp.id}/complete`,{endTime});
      // Send notifications in background — use activeInsp (has user_id, start_time, items)
      const detail={...activeInsp, end_time: endTime};
      (async()=>{
        try{
          const cfg=await api.get("/api/config");
          const content=await buildEmailContent(detail,users,zones);
          const inspector=users.find(u=>u.id===detail.user_id);
          const subj="InspectPro Report – "+(inspector?.name||detail.user_name||"")+" – "+fD(detail.start_time);
          const targets=[];
          if(inspector?.email?.trim())targets.push({email:inspector.email.trim(),name:inspector.name,subj});
          users.filter(u=>isManagerRole(u.role)&&u.email?.trim()).forEach(m=>{if(!targets.find(t=>t.email===m.email.trim()))targets.push({email:m.email.trim(),name:m.name,subj:"[InspectPro] "+subj});});
          if(targets.length>0){
            const results=await Promise.allSettled(targets.map(t=>sendEmail(t.email,t.name,t.subj,content,cfg)));
            const ok=results.filter(r=>r.status==="fulfilled"&&r.value?.ok).length;
            if(ok>0)showToast("Report emailed ✓","ok");
          }
          const flagCount=(detail.items||[]).filter(i=>i.status==="flagged").length;
          const tgMsg="Inspection complete: "+(detail.zone_name||detail.zone_id)+" · "+(inspector?.name||"")+(flagCount?" · "+flagCount+" flag"+( flagCount>1?"s":""):" · All clear");
          await notifyTelegram("InspectPro",tgMsg,cfg);
        }catch(ex){console.warn("[notify]",ex);}
      })();
      setActiveInsp(null);setStep("done");
    }catch(e){setErr("Submit failed: "+e.message);}
    setSending(false);
  };

  if(!authUser) return <div style={{textAlign:"center",padding:"60px 20px"}}>
    <div style={{fontSize:36,marginBottom:14}}>🔒</div>
    <div style={{fontWeight:600,color:"var(--t1)",fontSize:17,marginBottom:6}}>Sign in to start an inspection</div>
    <p style={{color:"var(--t2)",fontSize:14}}>Use the Sign In button in the top bar.</p>
  </div>;

  return <div>
    {err&&<ErrBox msg={err}/>}
    {step==="select"&&<SelectStep zones={zones} users={users} authUser={authUser} today={today} onStart={startInspection}/>}
    {step==="zone"&&activeInsp&&<ZoneStep inspection={activeInsp} updateItem={updateItem} addMedia={addMediaToItem} removeMedia={removeMediaFromItem} onFinish={finishZone} onCancel={cancelInspection} users={users}/>}
    {step==="summary"&&activeInsp&&<SummaryStep inspection={activeInsp} users={users} zones={zones} onSubmit={submitInspection} sending={sending}/>}
    {step==="done"&&<div style={{maxWidth:480,margin:"60px auto",textAlign:"center",padding:"0 16px"}}>
      <div style={{fontSize:52,marginBottom:14}}>✅</div>
      <h2 style={{fontSize:22,fontWeight:700,color:"var(--t1)",marginBottom:8}}>Inspection Submitted</h2>
      <p style={{color:"var(--t2)",fontSize:15,marginBottom:28}}>Report sent to the team. Good work!</p>
      <button onClick={()=>setStep("select")} style={C.btn("pri",{padding:"12px 28px",fontSize:15})}>New Inspection</button>
    </div>}
  </div>;
}

function ZoneStep({inspection,updateItem,addMedia,removeMedia,onFinish,onCancel,users}){

  const user=users.find(u=>u.id===inspection.user_id);
  const items=inspection.items||[];
  const allDone=items.every(i=>i.status!=="pending");
  const photoRefs=useRef({});
  const [obsMap,setObsMap]=useState(()=>Object.fromEntries((inspection.items||[]).map(it=>[it.id,it.observation||""])));
  const obsTimers=useRef({});
  const [lightbox,setLightbox]=useState(null);
  const [expandedOk,setExpandedOk]=useState(new Set());
  const [markupTarget,setMarkupTarget]=useState(null); // {itemId, file}
  const toggleExpand=id=>setExpandedOk(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const openLightbox=(items,idx=0)=>setLightbox({items,idx});
  const handleObsChange=(itemId,value)=>{
    setObsMap(p=>({...p,[itemId]:value}));
    clearTimeout(obsTimers.current[itemId]);
    obsTimers.current[itemId]=setTimeout(()=>{
      updateItem(itemId,{observation:value});
    },600);
  };

  const handlePhoto=async(itemId,e)=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    // Show markup modal before uploading
    setMarkupTarget({itemId,file:f});
  };

  const handleMarkupSave=async(annotatedFile)=>{
    const{itemId}=markupTarget;
    setMarkupTarget(null);
    try{
      const ik=await uploadToImageKit(annotatedFile,"inspectpro/photos");
      const saved=await api.post("/api/media",{
        inspectionItemId:itemId,type:"photo",

      addMedia(itemId,saved);

  const handleVideo=async(itemId,file)=>{

        inspectionItemId:itemId,type:"video",
        imagekitFileId:ik.fileId,url:ik.url,
        thumbnailUrl:ik.thumbnailUrl,size:ik.size,name:ik.name,
      });
      addMedia(itemId,saved);
    }catch(e){showToast("Video upload failed: "+e.message,"err");}

                    <img src={m.thumbnail_url||m.url} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    <button onClick={e=>{e.stopPropagation();delMedia(item.id,m.id);}} style={{position:"absolute",top:1,right:1,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:3,fontSize:9,cursor:"pointer",padding:"1px 3px"}}>✕</button>
                  </div>
                  :<div key={mi} style={{position:"relative",width:56,height:56,borderRadius:6,overflow:"hidden",border:"1px solid var(--bd2)",flexShrink:0,background:"#000",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontSize:22}}>🎥</span>

                  </div>;

    </div>
    <div style={{position:"sticky",bottom:0,background:"var(--bg)",borderTop:"1px solid var(--bd)",padding:"12px 0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:50,marginTop:4}}>
      {!allDone

    </div>
    {lightbox&&<Lightbox items={lightbox.items} startIdx={lightbox.idx} onClose={()=>setLightbox(null)}/>}
    {markupTarget&&<PhotoMarkupModal file={markupTarget.file} onSave={handleMarkupSave} onCancel={()=>setMarkupTarget(null)}/>}

}

// ── PHOTO MARKUP MODAL ────────────────────────────────────────────────────────
function PhotoMarkupModal({file, onSave, onCancel}){
  const canvasRef=useRef(null);
  const [history,setHistory]=useState([]);
  const [color,setColor]=useState('#ef4444');
  const [brushSize,setBrushSize]=useState(14);
  const isDrawing=useRef(false);
  const COLORS=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#ffffff','#000000'];

  useEffect(()=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const canvas=canvasRef.current;if(!canvas)return;
      // Scale down to max 1400px on longest side — keeps canvas on-screen and undo snapshots lean
      const MAX=1400;
      const scale=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
      canvas.width=Math.round(img.naturalWidth*scale);
      canvas.height=Math.round(img.naturalHeight*scale);
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      setHistory([ctx.getImageData(0,0,canvas.width,canvas.height)]);
      URL.revokeObjectURL(url);
    };
    img.src=url;
  },[file]);

  const getPos=e=>{
    const canvas=canvasRef.current;
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-rect.left)*sx,y:(src.clientY-rect.top)*sy};
  };

  const startDraw=e=>{
    e.preventDefault();
    isDrawing.current=true;
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const{x,y}=getPos(e);
    ctx.beginPath();ctx.moveTo(x,y);
  };

  const draw=e=>{
    e.preventDefault();
    if(!isDrawing.current)return;
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const{x,y}=getPos(e);
    ctx.strokeStyle=color;ctx.lineWidth=brushSize;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(x,y);ctx.stroke();
  };

  const endDraw=e=>{
    if(!isDrawing.current)return;
    isDrawing.current=false;
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const snap=ctx.getImageData(0,0,canvas.width,canvas.height);
    setHistory(h=>[...h,snap]);
  };

  const undo=()=>{
    if(history.length<=1)return;
    const newH=history.slice(0,-1);
    setHistory(newH);
    const canvas=canvasRef.current;
    canvas.getContext('2d').putImageData(newH[newH.length-1],0,0);
  };

  const handleSave=()=>{
    canvasRef.current.toBlob(blob=>{
      onSave(new File([blob],'annotated.jpg',{type:'image/jpeg'}));
    },'image/jpeg',0.92);
  };

  return <div style={{position:"fixed",inset:0,zIndex:3000,background:"rgba(0,0,0,.96)",display:"flex",flexDirection:"column"}}>
    <div style={{padding:"10px 12px",display:"flex",alignItems:"center",gap:8,background:"#111",flexShrink:0,flexWrap:"wrap"}}>
      <button onClick={onCancel} style={{background:"none",border:"1px solid #444",color:"#ccc",borderRadius:7,padding:"6px 12px",fontSize:13,cursor:"pointer"}}>✕ Cancel</button>
      <div style={{flex:1,display:"flex",alignItems:"center",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
        {COLORS.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:24,height:24,minWidth:24,minHeight:24,borderRadius:"50%",background:c,border:color===c?"3px solid #fff":"2px solid rgba(255,255,255,.25)",cursor:"pointer",flexShrink:0,padding:0,boxSizing:"border-box",alignSelf:"center",WebkitAppearance:"none",appearance:"none",lineHeight:0}}/>)}
        <select value={brushSize} onChange={e=>setBrushSize(+e.target.value)} style={{background:"#222",color:"#fff",border:"1px solid #444",borderRadius:6,padding:"4px 7px",fontSize:12}}>
          <option value={6}>Normal</option>
          <option value={14}>Bold</option>
        </select>
        <button onClick={undo} disabled={history.length<=1} style={{background:"none",border:"1px solid #444",color:history.length<=1?"#555":"#ccc",borderRadius:7,padding:"5px 11px",fontSize:13,cursor:"pointer"}}>↩ Undo</button>
      </div>

      <canvas ref={canvasRef}
        style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",touchAction:"none",cursor:"crosshair",borderRadius:4,display:"block"}}
        onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}

    </div>

}

// ── VIDEO CAPTURE (upload to ImageKit, not IndexedDB) ─────────────────────────
function VideoCapture({onCapture}){
  const [rec,setRec]=useState(false);const [ct,setCt]=useState(0);const [saving,setSaving]=useState(false);
  const mrRef=useRef(null);const stRef=useRef(null);const ivRef=useRef(null);
  const mobileRef=useRef(null);const desktopRef=useRef(null);
  const isMobile=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

  const onFile=async f=>{if(!f)return;setSaving(true);try{await onCapture(f);}catch(e){showToast("Video upload failed: "+e.message,"err");}setSaving(false);};
  const startDesktop=async()=>{
    try{
      const mimes=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm","video/mp4"];
      const mime=mimes.find(m=>MediaRecorder.isTypeSupported?.(m))||"";
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:true});
      stRef.current=stream;
      const mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      mrRef.current=mr;const chunks=[];
      mr.ondataavailable=e=>e.data.size>0&&chunks.push(e.data);
      mr.onstop=async()=>{
        const blob=new Blob(chunks,{type:mr.mimeType||"video/webm"});
        stream.getTracks().forEach(t=>t.stop());
        clearInterval(ivRef.current);setRec(false);setCt(0);
        const file=new File([blob],"recording.webm",{type:blob.type});
        await onFile(file);
      };
      mr.start(200);setRec(true);setCt(30);
      ivRef.current=setInterval(()=>setCt(c=>{if(c<=1){stopDesktop();return 0;}return c-1;}),1000);
    }catch{desktopRef.current?.click();}
  };
  const stopDesktop=()=>{clearInterval(ivRef.current);if(mrRef.current?.state==="recording")mrRef.current.stop();};

  if(saving)return <div style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:"var(--t2)"}}><Spinner size={14}/>Uploading…</div>;
  return <div style={{display:"inline-flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
    {isMobile
      ?<><button onClick={()=>mobileRef.current?.click()} style={C.btn("ghost",{padding:"6px 12px",fontSize:13})}>🎥 Video</button>
        <input type="file" accept="video/*" capture="environment" ref={mobileRef} onChange={e=>{const f=e.target.files?.[0];if(f)onFile(f);e.target.value="";}} style={{display:"none"}}/></>
      :!rec
        ?<div style={{display:"inline-flex",gap:6}}>
          <button onClick={startDesktop} style={C.btn("ghost",{padding:"6px 12px",fontSize:13})}>🎥 Record 30s</button>
          <button onClick={()=>desktopRef.current?.click()} style={C.btn("ghost",{padding:"6px 10px",fontSize:13})} title="Upload video">📎</button>
        </div>
        :<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 12px",background:"var(--op-bg)",borderRadius:8}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:"var(--red)",animation:"blink 1s infinite",display:"inline-block"}}/>
          <span style={{fontSize:13,color:"var(--op-fg)",fontWeight:600}}>{ct}s</span>
          <button onClick={stopDesktop} style={C.btn("dng",{padding:"4px 10px",fontSize:12})}>Stop</button>
        </div>
    }
    <input type="file" accept="video/*" ref={desktopRef} onChange={e=>{const f=e.target.files?.[0];if(f)onFile(f);e.target.value="";}} style={{display:"none"}}/>
  </div>;
}

function TrackerItem({item,expanded,onToggle,onUpdateStatus,onNotePosted,authUser}){
  const [note,setNote]=useState("");
  const [notes,setNotes]=useState(null);
  const [loadingNotes,setLoadingNotes]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [localMedia,setLocalMedia]=useState(null); // null = use item.media; set after upload
  const [mediaUploading,setMediaUploading]=useState(false);
  const [markupFile,setMarkupFile]=useState(null);
  const trackerPhotoRef=useRef(null);
  const trackerVideoRef=useRef(null);
  const trackerGalleryRef=useRef(null);

  useEffect(()=>{
    if(expanded&&notes===null){
      setLoadingNotes(true);
      api.get(`/api/issues/${item.id}`).then(d=>setNotes(d.notes||[])).catch(()=>setNotes([])).finally(()=>setLoadingNotes(false));
    }
  },[expanded,item.id]);

  const postNote=async()=>{
    if(!note.trim())return;
    try{
      const n=await api.post(`/api/issues/${item.id}/notes`,{text:note.trim()});
      setNotes(p=>[...(p||[]),n]);
      setNote("");
      onNotePosted?.(item.id); // bump parent note_count badge
    }catch(e){showToast("Could not post note: "+e.message,"err");}
  };

  const uploadMediaFile=async(file,isVid)=>{
    if(!item.inspection_item_id){showToast("Cannot attach media to this issue","err");return;}
    setMediaUploading(true);
    try{
      const ik=await uploadToImageKit(file,isVid?"inspectpro/videos":"inspectpro/photos");
      const saved=await api.post("/api/media",{
        inspectionItemId:item.inspection_item_id,
        type:isVid?"video":"photo",
        imagekitFileId:ik.fileId,url:ik.url,
        thumbnailUrl:ik.thumbnailUrl,size:ik.size,name:ik.name,
      });
      setLocalMedia(p=>[...(p??item.media??[]),saved]);
      showToast("Media attached","ok");
    }catch(err){showToast("Upload failed: "+err.message,"err");}
    setMediaUploading(false);
  };

  const handleTrackerPhoto=e=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    setMarkupFile(f); // open markup before upload
  };

  const handleTrackerVideo=async e=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    await uploadMediaFile(f,true);
  };

  const handleTrackerGallery=async e=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    const isVid=/^video\//.test(f.type);
    if(isVid)await uploadMediaFile(f,true);
    else setMarkupFile(f); // photo → markup first
  };

  const handleMarkupSave=async annotated=>{
    setMarkupFile(null);
    await uploadMediaFile(annotated,false);
  };

  const media=localMedia??item.media??[];
  const openLightbox=(items,idx=0)=>setLightbox({items,idx});

  return <div style={{background:"var(--card)",border:`1px solid ${expanded?"var(--bd2)":"var(--bd)"}`,borderRadius:10,overflow:"hidden"}}>
    <div onClick={onToggle} style={{padding:"12px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:9}}>
      <Badge status={item.status}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:14,fontWeight:600,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.item_label}</div>
        <div style={{display:"flex",gap:6,marginTop:2,flexWrap:"wrap"}}>
          <Mono size={11} color="var(--t3)" style={{background:"var(--bbg)",padding:"2px 6px",borderRadius:4}}>{item.zone_id}</Mono>
          <Mono size={11} color="var(--t3)">{item.zone_name}</Mono>
          <Mono size={11} color="var(--t3)">· {fD(item.created_at)}</Mono>
          <Mono size={11} color="var(--t3)">· {item.creator_name}</Mono>
          {(item.note_count||0)>0&&<Mono size={11} color="var(--blue)">· {item.note_count} note{item.note_count>1?"s":""}</Mono>}
        </div>
      </div>
      <span style={{color:"var(--t3)",fontSize:11,flexShrink:0}}>{expanded?"▲":"▼"}</span>
    </div>
    {expanded&&<div style={{borderTop:"1px solid var(--bd)",padding:"14px 16px",background:"var(--surf)"}}>
      {item.observation&&<div style={{marginBottom:12}}><Lbl>Observation</Lbl><div style={{fontSize:14,color:"var(--t2)",background:"var(--card)",borderRadius:7,padding:"9px 12px",lineHeight:1.6}}>{item.observation}</div></div>}
      {media.length>0&&<div style={{marginBottom:12}}>
        <Lbl>Media</Lbl>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {media.map((m,i)=>{
            const photos=media.filter(x=>x.type==="photo");
            const videos=media.filter(x=>x.type==="video");
            return m.type==="photo"
            ?<img key={i} src={m.thumbnail_url||m.url}
                onClick={()=>{const lbItems=photos.map((x,j)=>({type:"photo",url:x.url,caption:`Photo ${j+1}`}));openLightbox(lbItems,photos.indexOf(m));}}
                style={{width:80,height:80,objectFit:"cover",borderRadius:7,border:"1px solid var(--bd)",cursor:"zoom-in"}}/>
            :<div key={i}
                onClick={()=>{const lbItems=videos.map((x,j)=>({type:"video",url:x.url,caption:`Video ${j+1}`}));openLightbox(lbItems,videos.indexOf(m));}}
                style={{width:80,height:80,borderRadius:7,border:"1px solid var(--bd)",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-in"}}><span style={{fontSize:28}}>🎥</span></div>;
          })}
        </div>
      </div>}
      <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
        <Mono size={11} color="var(--t3)" style={{textTransform:"uppercase"}}>Status:</Mono>
        {["open","in-progress","closed"].map(s=><button key={s} onClick={()=>onUpdateStatus(item.id,s)} style={{...C.btn(s==="closed"?"ok":s==="in-progress"?"sec":"dng",{padding:"5px 12px",fontSize:13}),opacity:item.status===s?1:.45,fontWeight:item.status===s?600:500}}>{s}</button>)}
      </div>
      <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
        <label style={{cursor:mediaUploading?"not-allowed":"pointer"}}>
          <span style={C.btn("ghost",{padding:"5px 11px",fontSize:12,border:"1px dashed var(--bd)",borderRadius:7,opacity:mediaUploading?.5:1})}>
            {mediaUploading?<Spinner size={12}/>:"📷 Camera"}
          </span>
          <input ref={trackerPhotoRef} type="file" accept="image/*" capture="environment" onChange={handleTrackerPhoto} style={{display:"none"}} disabled={mediaUploading}/>
        </label>
        <label style={{cursor:mediaUploading?"not-allowed":"pointer"}}>
          <span style={C.btn("ghost",{padding:"5px 11px",fontSize:12,border:"1px dashed var(--bd)",borderRadius:7,opacity:mediaUploading?.5:1})}>
            🎥 Video
          </span>
          <input ref={trackerVideoRef} type="file" accept="video/*" capture="environment" onChange={handleTrackerVideo} style={{display:"none"}} disabled={mediaUploading}/>
        </label>
        <label style={{cursor:mediaUploading?"not-allowed":"pointer"}}>
          <span style={C.btn("ghost",{padding:"5px 11px",fontSize:12,border:"1px dashed var(--bd)",borderRadius:7,opacity:mediaUploading?.5:1})}>
            📁 Gallery
          </span>
          <input ref={trackerGalleryRef} type="file" accept="image/*,video/*" onChange={handleTrackerGallery} style={{display:"none"}} disabled={mediaUploading}/>
        </label>
      </div>
      {loadingNotes?<div style={{padding:"8px"}}><Spinner/></div>:<>
        {notes&&notes.length>0&&<div style={{marginBottom:11}}>
          <Lbl>Activity Log</Lbl>
          {notes.map((n,i)=><div key={i} style={{background:"var(--card)",borderRadius:7,padding:"7px 10px",border:"1px solid var(--bd)",marginBottom:5}}>
            <div style={{fontSize:14,color:"var(--t1)",lineHeight:1.5}}>{n.text}</div>
            <Mono size={11}>{n.creator_name} · {fD(n.created_at)} {fT(n.created_at)}</Mono>
          </div>)}
        </div>}
        <Lbl>Add Note</Lbl>
        <div style={{display:"flex",gap:7}}>
          <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Add a follow-up note…" style={C.inp({flex:1})} onKeyDown={e=>e.key==="Enter"&&postNote()}/>
          <button onClick={postNote} style={C.btn("pri",{padding:"9px 15px",flexShrink:0})}>Post</button>
        </div>
      </>}
    </div>}
    {lightbox&&<Lightbox items={lightbox.items} startIdx={lightbox.idx} onClose={()=>setLightbox(null)}/>}
    {markupFile&&<PhotoMarkupModal file={markupFile} onSave={handleMarkupSave} onCancel={()=>setMarkupFile(null)}/>}
  </div>;
}

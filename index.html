        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(190px,1.2fr)",gap:8,alignItems:"center",background:wkKey(today)===wk?"var(--abg)":"var(--card2)",border:"1px solid var(--bd)",borderRadius:8,padding:"9px 12px"}}>
          <Mono size={12} color="var(--t3)" style={{textTransform:"uppercase"}}>Zone</Mono>
          <div style={{fontSize:13,fontWeight:700,color:wkKey(today)===wk?"var(--amber)":"var(--t2)",textAlign:"right"}}>Assigned This Week <span style={{fontWeight:500,color:"var(--t3)"}}>complete any working day</span></div>
        </div>
        {zones.map(zone=>{
          const slots=getSlotsForZoneDay(zone.id,"Week");
          const isDropTarget=pickedInspector&&canEdit;
          return <div key={zone.id}
            onClick={()=>quickAssign("Week",zone.id)}
            onDragOver={e=>canEdit&&e.preventDefault()}
            onDrop={e=>{e.preventDefault();quickAssign("Week",zone.id,e.dataTransfer.getData("text/plain"));}}
            style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(190px,1.2fr)",gap:10,alignItems:"stretch",background:isDropTarget?"var(--bbg)":"var(--card)",border:`1px solid ${isDropTarget?"var(--blue)":"var(--bd)"}`,borderRadius:8,padding:10,cursor:isDropTarget?"copy":"default"}}>
            <div style={{display:"flex",alignItems:"center",gap:9,minWidth:0}}>
              <Mono size={12} color="var(--blue)" style={{background:"var(--bbg)",padding:"3px 8px",borderRadius:5,flexShrink:0}}>{zone.id}</Mono>
              <div style={{fontSize:15,fontWeight:700,color:"var(--t1)",lineHeight:1.25,overflowWrap:"anywhere"}}>{zone.name}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"stretch",minWidth:0}}>
              {slots.map(s=>{
                const insps=(s.inspectorIds||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
                const sups=(s.supervisorIds||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
                return <div key={s.id} style={{background:"var(--surf)",borderRadius:8,padding:"8px 10px",border:"1px solid var(--bd2)"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",justifyContent:"flex-end",flexWrap:"wrap"}}>
                    {insps.map((u,j)=>{const cs=roleChipStyle(u.role);return <div key={j} style={{display:"flex",alignItems:"center",gap:6,...cs,borderRadius:20,padding:"4px 8px 4px 4px"}}>
                      <Avatar user={u} size={24}/><span style={{fontSize:13,fontWeight:700,color:cs.color}}>{displayName(u,users)}</span>
                      {completed[completionKey(u.id,zone.id)]
                        ?<span style={{fontSize:11,fontWeight:700,background:"var(--cl-bg)",color:"var(--cl-fg)",padding:"2px 7px",borderRadius:20}}>Done</span>
                        :<span style={{fontSize:11,fontWeight:700,background:"var(--pd-bg)",color:"var(--pd-fg)",padding:"2px 7px",borderRadius:20}}>Due</span>}
                    </div>;})}
                    {sups.map((u,j)=><div key={"s"+j} style={{display:"flex",alignItems:"center",gap:5,background:"var(--bbg)",border:"1px solid var(--blue)44",borderRadius:20,padding:"3px 7px 3px 3px"}}>
                      <Avatar user={u} size={20}/><Mono size={11} color="var(--blue)">{displayName(u,users)}</Mono>
                    </div>)}
                  </div>
                  {canEdit&&<div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:7}}>
                    <button onClick={e=>{e.stopPropagation();setEf({inspIds:[...(s.inspectorIds||[])],supIds:[...(s.supervisorIds||[])],zoneId:s.zoneId});setEditCell({day:"Week",slotId:s.id});}} style={C.btn("ghost",{padding:"4px 9px",fontSize:12})}>Edit</button>
                    <button onClick={e=>{e.stopPropagation();deleteSlot(s.id);}} style={C.btn("dng",{padding:"4px 8px",fontSize:12})}>Remove</button>
                  </div>}
                </div>;})}
              {slots.length===0&&<div style={{border:"1px dashed var(--bd2)",borderRadius:8,padding:"9px 10px",textAlign:"right",fontSize:13,color:"var(--t3)"}}>Unassigned</div>}
              {canEdit&&<button onClick={e=>{e.stopPropagation();setEf({inspIds:[],supIds:[],zoneId:zone.id});setEditCell({day:"Week",slotId:null});}} style={{background:"transparent",border:"1px dashed var(--bd2)",borderRadius:7,padding:"7px 0",color:"var(--t3)",cursor:"pointer",fontSize:13,width:"100%",textAlign:"center"}}>+ Add assignment</button>}
            </div>
          </div>;
        })}
      </div>
    }
    {showAutoPlan&&<AutoPlanModal users={users} zones={zones} onClose={()=>setShowAutoPlan(false)} today={today} onApplied={load}/>}
    {editCell&&<Modal onClose={()=>setEditCell(null)} title={editCell.slotId?"Edit Slot":"Add Slot"} maxW={460}>
      <Lbl>Zone</Lbl>
      <select value={ef.zoneId} onChange={e=>setEf(f=>({...f,zoneId:e.target.value}))} style={C.inp({marginBottom:12})}>
        <option value="">— Select zone —</option>
        {zones.map(z=><option key={z.id} value={z.id}>{z.id} – {z.name}</option>)}
      </select>
      <Lbl>Inspector(s)</Lbl>
      <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
        {people.map(u=><label key={u.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:ef.inspIds.includes(u.id)?"var(--bbg)":"var(--surf)",border:`1px solid ${ef.inspIds.includes(u.id)?"var(--blue)":"var(--bd)"}`,borderRadius:20,cursor:"pointer"}}>
          <input type="checkbox" checked={ef.inspIds.includes(u.id)} onChange={()=>setEf(f=>({...f,inspIds:toggleId(f.inspIds,u.id)}))} style={{accentColor:"var(--blue)"}}/>
          <Avatar user={u} size={18}/><span style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{displayName(u,people)}</span>
        </label>)}
      </div>
      <Lbl>Supervisor (optional)</Lbl>
      <select value={ef.supIds[0]||""} onChange={e=>setEf(f=>({...f,supIds:e.target.value?[e.target.value]:[]}))} style={C.inp({marginBottom:16})}>
        <option value="">None</option>
        {users.filter(u=>isManagerRole(u.role)).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
      </select>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>setEditCell(null)} style={C.btn("ghost")}>Cancel</button>
        <button onClick={saveSlot} disabled={!ef.zoneId} style={{...C.btn("pri"),opacity:ef.zoneId?1:.35}}>Save</button>
      </div>
    </Modal>}
  </div>;
}

// ── YEAR PLAN VIEW ────────────────────────────────────────────────────────────
function YearPlanView({users,zones,today,authUser}){
  const [yr,setYr]=useState(today.getFullYear());
  const [yearData,setYearData]=useState({});
  const [loading,setLoading]=useState(true);
  const [mode,setMode]=useState("dot");
  const [showAutoPlan,setShowAutoPlan]=useState(false);
  const todayWk=wkKey(today);

  useEffect(()=>{
    setLoading(true);
    api.get(`/api/roster/range?from=${yr}-W01&to=${yr}-W53`)
      .then(d=>setYearData(d)).catch(()=>{})
      .finally(()=>setLoading(false));
  },[yr]);

  const weeks=[];
  const d=new Date(getMon(new Date(yr,0,1)));
  while(weeks.length<=53){
    const{week,year:wy}=isoWk(d);if(wy>yr)break;
    if(wy===yr){const wk=`${wy}-W${String(week).padStart(2,"0")}`;const end=new Date(d);end.setDate(end.getDate()+6);
    weeks.push({wk,week,monday:new Date(d),end,data:yearData[wk]||{}});}
    d.setDate(d.getDate()+7);
  }

  const thS={background:"var(--card2)",border:"1px solid var(--bd)",padding:"7px 6px",textAlign:"center",fontSize:12,fontWeight:600,color:"var(--t2)",position:"sticky",top:0};
  const tdS={border:"1px solid var(--bd)",padding:"4px 3px",textAlign:"center",verticalAlign:"middle"};

  return <div className="fu">
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:12}}>
      <div><h1 style={{fontSize:26,letterSpacing:"-.02em",marginBottom:4}}>Year Roster Plan</h1><Mono size={13}>Full-year view · {yr}</Mono></div>
      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
        <div style={{display:"flex",background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:8,overflow:"hidden"}}>
          {[{id:"full",l:"Names"},{id:"dot",l:"Compact"}].map(m=><button key={m.id} onClick={()=>setMode(m.id)} style={{padding:"6px 12px",fontSize:13,border:"none",cursor:"pointer",background:mode===m.id?"var(--amber)":"transparent",color:mode===m.id?"#fff":"var(--t2)",fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>{m.l}</button>)}
        </div>
        <button onClick={()=>setYr(y=>y-1)} style={C.btn("ghost",{padding:"6px 11px",fontSize:13})}>← {yr-1}</button>
        <button onClick={()=>setYr(today.getFullYear())} style={C.btn("sec",{padding:"6px 10px",fontSize:13})}>This Year</button>
        <button onClick={()=>setYr(y=>y+1)} style={C.btn("ghost",{padding:"6px 11px",fontSize:13})}>{yr+1} →</button>
        {canManageOps(authUser)&&<button onClick={()=>setShowAutoPlan(true)} style={C.btn("pri",{padding:"6px 12px",fontSize:13})}>⚡ Auto-Plan</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:7,marginBottom:12,flexWrap:"wrap"}}>
      {users.map(u=><div key={u.id} style={{display:"flex",alignItems:"center",gap:6,background:"var(--card)",border:"1px solid var(--bd)",borderRadius:20,padding:"3px 10px"}}>
        <div style={{width:9,height:9,borderRadius:"50%",background:u.color}}/><span style={{fontSize:13,color:"var(--t2)"}}>{displayName(u,users)}</span>
      </div>)}
    </div>
    {loading?<div style={{textAlign:"center",padding:"48px"}}><Spinner size={24}/></div>:
      <div style={{overflowX:"auto",borderRadius:12,border:"1px solid var(--bd)"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:560}}>
          <thead><tr>
            <th style={{...thS,textAlign:"left",padding:"7px 12px",width:55}}><Mono size={11}>Wk</Mono></th>
            <th style={{...thS,textAlign:"left",width:70}}><Mono size={11}>Dates</Mono></th>
            {DAYS.map(d=><th key={d} style={{...thS,minWidth:mode==="full"?95:42}}><Mono size={11}>{d}</Mono></th>)}
          </tr></thead>
          <tbody>{weeks.map(({wk,week,monday,end,data})=>{
            const isC=wk===todayWk;
            return <tr key={wk} style={{background:isC?"var(--abg)":"transparent"}}>
              <td style={{...tdS,textAlign:"left",padding:"5px 12px"}}><Mono size={12} color={isC?"var(--amber)":"var(--t3)"} style={{fontWeight:isC?600:400,whiteSpace:"nowrap"}}>{isC?"▶ ":""}{`W${String(week).padStart(2,"0")}`}</Mono></td>
              <td style={{...tdS,textAlign:"left",padding:"5px 8px"}}><Mono size={11} style={{whiteSpace:"nowrap"}}>{fS(monday)}–{fS(end)}</Mono></td>
              {DAYS.map(day=>{
                const slots=data[day]||[];
                return <td key={day} style={tdS}>
                  {mode==="full"
                    ?<div style={{display:"flex",flexDirection:"column",gap:2,padding:"2px"}}>
                      {slots.slice(0,3).map((s,i)=>{const u=users.find(u=>(s.inspectorIds||[]).includes(u.id));
                        return <div key={i} style={{fontSize:9,fontWeight:600,background:u?.color?`${u.color}22`:"var(--card2)",color:"var(--t1)",borderRadius:3,padding:"1px 4px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:88}}>
                          {u?displayName(u,users):"?"} <Mono size={8} color="var(--t3)">{s.zoneId}</Mono>
                        </div>;})}
                      {slots.length>3&&<Mono size={9} color="var(--t3)">+{slots.length-3}</Mono>}
                    </div>
                    :<div style={{display:"flex",justifyContent:"center",gap:2,flexWrap:"wrap",padding:"4px 2px"}}>
                      {slots.length===0?<div style={{width:8,height:8,borderRadius:"50%",background:"var(--bd)"}}/>:
                        slots.map((s,i)=>{const u=users.find(u=>(s.inspectorIds||[]).includes(u.id));return <div key={i} style={{width:9,height:9,borderRadius:"50%",background:u?.color||"var(--blue)"}}/>;})
                      }
                    </div>
                  }
                </td>;})}
            </tr>;})}
          </tbody>
        </table>
      </div>
    }
    {showAutoPlan&&<AutoPlanModal users={users} zones={zones} onClose={()=>setShowAutoPlan(false)} today={today} onApplied={()=>{setLoading(true);api.get(`/api/roster/range?from=${yr}-W01&to=${yr}-W53`).then(d=>setYearData(d)).finally(()=>setLoading(false));}}/>}
  </div>;
}

// ── REPORTS VIEW ──────────────────────────────────────────────────────────────
function ReportsView({users,zones,authUser}){
  const [inspections,setInspections]=useState([]);
  const [reportMonth,setReportMonth]=useState(new Date().toISOString().slice(0,7));
  const [monthly,setMonthly]=useState(null);
  const [monthlyLoading,setMonthlyLoading]=useState(false);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [selDetail,setSelDetail]=useState(null);
  const [loadingDetail,setLoadingDetail]=useState(false);
  const [err,setErr]=useState("");
  const [deleting,setDeleting]=useState(null);
  const [lightbox,setLightbox]=useState(null);
  const openLightbox=(items,idx=0)=>setLightbox({items,idx});
  const submitted=inspections.filter(i=>i.report_sent&&i.end_time);

  useEffect(()=>{
    api.get("/api/inspections?limit=100")
      .then(d=>setInspections(d)).catch(e=>setErr(e.message))
      .finally(()=>setLoading(false));
  },[]);

  const loadDetail=async(id)=>{
    if(sel===id){setSel(null);setSelDetail(null);return;}
    setSel(id);setLoadingDetail(true);
    try{const d=await api.get(`/api/inspections/${id}`);setSelDetail(d);}
    catch(e){setErr(e.message);}
    setLoadingDetail(false);
  };

  const deleteInspection=async(rec,e)=>{
    e.stopPropagation();
    if(!await showConfirm(`Delete this inspection report by ${rec.user_name} (${fD(rec.start_time)})? This cannot be undone.`))return;
    setDeleting(rec.id);
    try{
      await api.delete(`/api/inspections/${rec.id}`);
      setInspections(prev=>prev.filter(i=>i.id!==rec.id));
      setSel(null);setSelDetail(null);
      showToast("Inspection deleted","ok");
    }catch(ex){showToast("Delete failed: "+ex.message,"err");}
    setDeleting(null);
  };

  const loadMonthly=async()=>{
    setMonthlyLoading(true);setErr("");
    try{setMonthly(await api.get(`/api/inspections/reports/monthly?month=${reportMonth}`));}
    catch(e){setErr(e.message);}
    setMonthlyLoading(false);
  };
  const printMonthly=()=>{
    if(!monthly)return;
    const win=window.open("","_blank");
    const openIssues=(monthly.issues||[]).filter(i=>i.status!=="closed").length;
    const closedIssues=(monthly.issues||[]).filter(i=>i.status==="closed").length;
    const issueRows=(monthly.issues||[]).map(i=>`
      <tr>
        <td>${i.zone_id} · ${i.zone_name}</td>
        <td>${i.item_label}<br/><span>${i.observation||""}</span></td>
        <td><b class="${i.status==="closed"?"ok":"warn"}">${i.status}</b></td>
      </tr>`).join("");
    const inspRows=(monthly.inspections||[]).map(i=>`
      <tr><td>${fD(i.start_time)}</td><td>${i.zone_id} · ${i.zone_name}</td><td>${i.user_name}</td><td>${i.ok_count}/${i.total_items}</td><td>${i.flag_count}</td></tr>
    `).join("");
    const evidence=(monthly.issues||[]).flatMap(i=>(i.media||[]).map(m=>({issue:i,url:m.thumbnail_url||m.url,type:m.type}))).slice(0,8);
    win.document.write(`<!doctype html><html><head><title>InspectPro Monthly Report ${monthly.month}</title>
      <style>
        body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;margin:36px;line-height:1.45}
        h1{font-size:30px;margin:0 0 4px} h2{font-size:18px;margin:26px 0 10px;color:#334155}
        .sub{color:#64748b;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
        .card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px}.num{font-size:28px;font-weight:800}
        table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{border-bottom:1px solid #e2e8f0;text-align:left;padding:8px;vertical-align:top}th{background:#f8fafc;color:#475569}
        .ok{color:#059669}.warn{color:#dc2626}.evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.evidence img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0}
        @media print{body{margin:22mm}.no-print{display:none}.card{break-inside:avoid}}
      </style></head><body>
      <button class="no-print" onclick="window.print()" style="position:fixed;right:24px;top:18px;padding:10px 16px;border:0;border-radius:10px;background:#f59e0b;color:white;font-weight:700;">Save as PDF</button>
      <h1>InspectPro Monthly Management Report</h1><div class="sub">${monthly.month} · Generated ${fD(new Date())}</div>
      <div class="grid">
        <div class="card"><div class="num">${monthly.summary.inspections}</div><div>Completed inspections</div></div>
        <div class="card"><div class="num">${monthly.summary.zones_covered}</div><div>Zones covered</div></div>
        <div class="card"><div class="num">${monthly.summary.flagged_items}</div><div>Flagged checks</div></div>
        <div class="card"><div class="num">${openIssues}</div><div>Open issues</div></div>
      </div>
      <p><b>Management assurance:</b> ${monthly.summary.inspections} inspections completed, ${closedIssues} issue(s) closed, and ${openIssues} open issue(s) actively visible in the tracker.</p>
      <h2>Inspection Completion Log</h2><table><thead><tr><th>Date</th><th>Zone</th><th>Inspector</th><th>OK</th><th>Flags</th></tr></thead><tbody>${inspRows}</tbody></table>
      <h2>Issue Tracker Summary</h2><table><thead><tr><th>Zone</th><th>Observation</th><th>Status</th></tr></thead><tbody>${issueRows||"<tr><td colspan='3'>No issues raised.</td></tr>"}</tbody></table>
      ${evidence.length?`<h2>Evidence Gallery</h2><div class="evidence">${evidence.map(e=>`<div><img src="${e.url}"><div style="font-size:11px;color:#64748b;margin-top:4px">${e.issue.zone_id} · ${e.issue.item_label}</div></div>`).join("")}</div>`:""}
      </body></html>`);
    win.document.close();
  };

  if(loading) return <div style={{textAlign:"center",padding:"48px"}}><Spinner size={24}/></div>;

  return <div className="fu">
    <h1 style={{fontSize:26,letterSpacing:"-.02em",marginBottom:4}}>Inspection Reports</h1>
    <p style={{color:"var(--t2)",fontSize:14,marginBottom:18}}>{submitted.length} submitted</p>
    <ErrBox msg={err}/>
    {canManageOps(authUser)&&<div style={C.card({marginBottom:14,background:"var(--card2)"})}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        <div><div style={{fontWeight:700,color:"var(--t1)",fontSize:17}}>Monthly Management Report</div><p style={{fontSize:14,color:"var(--t2)",marginTop:3}}>Boss-friendly PDF view with completion, flags, tracker status and evidence.</p></div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input type="month" value={reportMonth} onChange={e=>setReportMonth(e.target.value)} style={C.inp({width:150})}/>
          <button onClick={loadMonthly} style={C.btn("sec",{padding:"9px 14px"})}>{monthlyLoading?<><Spinner size={13}/> Loading</>:"Generate"}</button>
          <button onClick={printMonthly} disabled={!monthly} style={{...C.btn("pri",{padding:"9px 14px"}),opacity:monthly?1:.35}}>PDF</button>
        </div>
      </div>
      {monthly&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8,marginTop:12}}>
        {[{l:"Inspections",v:monthly.summary.inspections},{l:"Zones",v:monthly.summary.zones_covered},{l:"Flags",v:monthly.summary.flagged_items},{l:"Issues",v:(monthly.issues||[]).length}].map(s=><div key={s.l} style={{background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:9,padding:"10px 12px"}}><div style={{fontSize:22,fontWeight:800,color:"var(--amber)"}}>{s.v}</div><Mono size={11}>{s.l}</Mono></div>)}
      </div>}
    </div>}
    {submitted.length===0
      ?<div style={{textAlign:"center",padding:"46px 20px",border:"1px solid var(--bd)",borderRadius:12,background:"var(--card)"}}>
        <div style={{fontSize:36,marginBottom:14}}>📋</div>
        <div style={{fontWeight:600,color:"var(--t1)",fontSize:17,marginBottom:6}}>No reports yet</div>
        <p style={{color:"var(--t2)",fontSize:14}}>Submitted inspections will appear here.</p>
      </div>
      :<div style={{display:"flex",flexDirection:"column",gap:0,border:"1px solid var(--bd)",borderRadius:12,overflow:"hidden"}}>
      {submitted.map((rec,idx)=>{
        const isOpen=sel===rec.id;
        return <div key={rec.id} style={{borderBottom:idx<submitted.length-1?"1px solid var(--bd)":"none"}}>
          <div onClick={()=>loadDetail(rec.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",cursor:"pointer",background:isOpen?"var(--card2)":"var(--card)",borderLeft:isOpen?"4px solid var(--blue)":"4px solid transparent",transition:"background .15s,border-color .15s"}}>
            <Avatar user={{initials:rec.initials,color:rec.color}} size={36}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:15,color:"var(--t1)",marginBottom:3}}>{rec.user_name||"Unknown"}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                <Mono size={12} color="var(--t3)">{fD(rec.start_time)} · {fT(rec.start_time)}</Mono>
                <Mono size={11} style={{background:"var(--bbg)",padding:"1px 6px",borderRadius:4,border:"1px solid var(--bd)"}}>{rec.zone_id}</Mono>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              {rec.flag_count>0
                ?<span style={{fontSize:12,fontWeight:600,background:"var(--op-bg)",color:"var(--op-fg)",padding:"3px 9px",borderRadius:20}}>⚠ {rec.flag_count} flagged</span>
                :<span style={{fontSize:12,fontWeight:600,background:"var(--cl-bg)",color:"var(--cl-fg)",padding:"3px 9px",borderRadius:20}}>✓ All clear</span>}
              <span style={{color:"var(--t3)",fontSize:14,transition:"transform .2s",transform:isOpen?"rotate(180deg)":"none",display:"inline-block"}}>▼</span>
            </div>
          </div>
          {isOpen&&<div style={{background:"var(--surf)",borderTop:"1px solid var(--bd2)",padding:"20px 22px"}}>
            {loadingDetail?<div style={{textAlign:"center",padding:"24px"}}><Spinner size={20}/></div>:selDetail&&
              <div>
                {canManageConfig(authUser)&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
                  <button onClick={e=>deleteInspection(rec,e)} disabled={!!deleting} style={{...C.btn("dng",{padding:"7px 14px",fontSize:13,display:"flex",alignItems:"center",gap:6}),opacity:deleting?0.5:1}}>
                    {deleting===rec.id?<><Spinner size={13}/>Deleting…</>:"🗑 Delete Report"}
                  </button>
                </div>}
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8,marginBottom:16}}>
                  {[
                    {l:"Inspector",v:rec.user_name},
                    {l:"Zone",v:`${rec.zone_id} · ${rec.zone_name}`},
                    {l:"Date",v:fD(rec.start_time)},
                    {l:"Duration",v:rec.end_time?fDur(new Date(rec.end_time)-new Date(rec.start_time)):"–"},
                    {l:"OK items",v:rec.ok_count},
                    {l:"Flagged",v:rec.flag_count},
                  ].map(s=><div key={s.l} style={C.card({padding:"10px 12px"})}>
                    <Mono size={11} style={{display:"block",marginBottom:3,textTransform:"uppercase"}}>{s.l}</Mono>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--t1)"}}>{s.v}</div>
                  </div>)}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {(selDetail.items||[]).map(item=>{
                    const dot=item.status==="ok"?"var(--green)":item.status==="flagged"?"var(--red)":"var(--t3)";
                    return <div key={item.id} style={{display:"flex",gap:10,padding:"8px 12px",background:item.status==="flagged"?"var(--fl-bg)":item.status==="ok"?"var(--ok-bg)":"var(--card)",borderRadius:8,border:`1px solid ${item.status==="flagged"?"var(--fl-bd)":"var(--bd)"}`,alignItems:"flex-start"}}>
                      <span style={{width:9,height:9,borderRadius:"50%",background:dot,flexShrink:0,marginTop:5}}/>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,color:"var(--t1)",fontWeight:item.status==="flagged"?600:400}}>{item.label}</div>
                        {item.observation&&<div style={{fontSize:12,color:"var(--t3)",marginTop:2,fontStyle:"italic"}}>{item.observation}</div>}
                        {(item.media||[]).length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:6}}>
                          {item.media.map((m,mi)=>{
                            const photos=item.media.filter(x=>x.type==="photo");
                            const videos=item.media.filter(x=>x.type==="video");
                            return m.type==="photo"
                            ?<img key={mi} src={m.thumbnail_url||m.url}
                              onClick={()=>{const lbItems=photos.map((x,i)=>({type:"photo",url:x.url,caption:`${item.label} – photo ${i+1}`}));openLightbox(lbItems,photos.indexOf(m));}}
                              style={{width:52,height:52,objectFit:"cover",borderRadius:5,border:"1px solid var(--bd)",cursor:"zoom-in"}}/>
                            :<div key={mi} onClick={()=>{const lbItems=videos.map((x,i)=>({type:"video",url:x.url,caption:`${item.label} – video ${i+1}`}));openLightbox(lbItems,videos.indexOf(m));}}
                              style={{width:52,height:52,borderRadius:5,border:"1px solid var(--bd)",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-in"}}><span style={{fontSize:20}}>🎥</span></div>;
                          })}
                        </div>}
                      </div>
                      <Badge status={item.status}/>
                    </div>;
                  })}
                </div>
              </div>}
          </div>}
        </div>;
      })}
      </div>}
    {lightbox&&<Lightbox items={lightbox.items} startIdx={lightbox.idx} onClose={()=>setLightbox(null)}/> }
  </div>;
}

// ── ADMIN PANEL ───────────────────────────────────────────────────────────────
const USER_COLORS=["#3b82f6","#8b5cf6","#06b6d4","#10b981","#f59e0b","#ec4899","#ef4444","#f97316","#84cc16","#14b8a6"];
// ── FEEDBACK MODAL ────────────────────────────────────────────────────────────
function FeedbackModal({onClose}){
  const [text,setText]=useState("");
  const [photo,setPhoto]=useState(null); // {url,thumbnailUrl}
  const [uploading,setUploading]=useState(false);
  const [submitting,setSubmitting]=useState(false);
  const [msg,setMsg]=useState("");

  const handleFile=async e=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    setUploading(true);setMsg("");
    try{
      const ik=await uploadToImageKit(f,"inspectpro/feedback");
      setPhoto({url:ik.url,thumbnailUrl:ik.thumbnailUrl||ik.url});
    }catch(err){setMsg("Upload failed: "+err.message);}
    setUploading(false);
  };

  const submit=async()=>{
    if(!text.trim()){setMsg("Please enter a comment.");return;}
    setSubmitting(true);setMsg("");
    try{
      await api.post("/api/feedback",{text:text.trim(),photo_url:photo?.url||null,thumbnail_url:photo?.thumbnailUrl||null});
      showToast("Feedback submitted — thank you!","ok");
      onClose();
    }catch(err){setMsg("Submit failed: "+err.message);}
    setSubmitting(false);
  };

  return <Modal onClose={onClose} title="💬 Pilot Feedback" maxW={440}>
    <p style={{fontSize:13,color:"var(--t3)",marginBottom:14,lineHeight:1.5}}>Help us improve InspectPro. All feedback goes directly to the admin team.</p>
    <Lbl>Your comment</Lbl>
    <textarea value={text} onChange={e=>setText(e.target.value)} rows={4} placeholder="What's working well? What needs improvement?" style={{...C.inp({marginBottom:12}),resize:"vertical",lineHeight:1.6}}/>
    <Lbl>Attach a photo or video (optional)</Lbl>
    {photo
      ?<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <img src={photo.thumbnailUrl} style={{width:64,height:64,objectFit:"cover",borderRadius:8,border:"1px solid var(--bd)"}}/>
          <button onClick={()=>setPhoto(null)} style={C.btn("dng",{padding:"5px 10px",fontSize:12})}>✕ Remove</button>
        </div>
      :<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:12}}>
          <span style={C.btn("ghost",{padding:"7px 13px",fontSize:13,border:"1px dashed var(--bd)",borderRadius:8})}>{uploading?<Spinner size={14}/>:"📎 Choose file"}</span>
          <input type="file" accept="image/*,video/*" onChange={handleFile} style={{display:"none"}} disabled={uploading}/>
        </label>
    }
    {msg&&<div style={{padding:"8px 12px",borderRadius:7,fontSize:13,marginBottom:10,background:"var(--op-bg)",color:"var(--op-fg)"}}>{msg}</div>}
    <button onClick={submit} disabled={submitting||uploading} style={{...C.btn("pri",{width:"100%",padding:"11px"}),opacity:submitting||uploading?.5:1}}>
      {submitting?<Spinner size={14}/>:"Send Feedback"}
    </button>
  </Modal>;
}

function AdminPanel({authUser,users,setUsers,zones,setZones,onClose,ejConfig,setEjConfig,tgConfig,setTgConfig}){
  const isAdmin=canManageConfig(authUser);
  const isMgr=isManagerRole(authUser?.role);
  const [tab,setTab]=useState(isAdmin?"team":"pin");
  // My email self-service
  const [myEmail,setMyEmail]=useState(authUser?.email||"");
  const [emailMsg,setEmailMsg]=useState("");
  const saveMyEmail=async()=>{
    setEmailMsg("Saving…");
    try{
      const u=await api.put(`/api/users/${authUser.id}`,{name:authUser.name,role:authUser.role,email:myEmail.trim(),color:authUser.color});
      setUsers(p=>p.map(uu=>uu.id===authUser.id?{...uu,...u}:uu));
      setEmailMsg("✅ Email saved.");
    }catch(e){setEmailMsg("❌ "+e.message);}
  };
  // PIN change — 3 steps: enter current → enter new → confirm → API call once
  const [ps,setPs]=useState("old");
  const [oldPin,setOldPin]=useState("");
  const [np,setNp]=useState("");
  const [pm,setPm]=useState("");
  const [pl,setPl]=useState(false);
  const handleOld=pin=>{setOldPin(pin);setPm("");setPs("new");};
  const handleNew=pin=>{setNp(pin);setPm("");setPs("confirm");};
  const handleConf=async pin=>{
    if(pin!==np){setPm("PINs don't match.");setPs("new");setNp("");return;}
    setPl(true);setPm("");
    try{
      await api.put("/api/auth/pin",{currentPin:oldPin,newPin:np});
      setPm("✓ PIN updated!");setPs("done");
    }catch(e){
      if(e.status===401){setPm("Current PIN incorrect.");setPs("old");setOldPin("");}
      else{setPm("Update failed: "+e.message);setPs("old");}
    }
    setPl(false);
  };

  // Team mgmt
  const [editingUser,setEditingUser]=useState(null);
  const [addingUser,setAddingUser]=useState(false);
  const [newUser,setNewUser]=useState({name:"",role:"inspector",email:"",color:USER_COLORS[0]});
  const [userErr,setUserErr]=useState("");

  const saveUserEdit=async(id,fields)=>{
    try{const u=await api.put(`/api/users/${id}`,fields);setUsers(p=>p.map(uu=>uu.id===id?{...uu,...u}:uu));setEditingUser(null);}
    catch(e){setUserErr(e.message);}
  };
  const removeUser=async id=>{
    if(!await showConfirm("Remove this team member?"))return;
    try{await api.delete(`/api/users/${id}`);setUsers(p=>p.filter(u=>u.id!==id));}
    catch(e){setUserErr(e.message);}
  };
  const addUser=async()=>{
    if(!newUser.name.trim())return;
    try{const u=await api.post("/api/users",{...newUser,pin:"123456"});setUsers(p=>[...p,u]);setNewUser({name:"",role:"inspector",email:"",color:USER_COLORS[0]});setAddingUser(false);}
    catch(e){setUserErr(e.message);}
  };
  const resetPin=async id=>{
    try{await api.post("/api/auth/reset-pin",{targetUserId:id});showToast("PIN reset to 123456","ok");}
    catch(e){showToast("Reset failed: "+e.message,"err");}
  };

  // Zones + checklist
  const [zoneDraft,setZoneDraft]=useState(()=>zones.map((z,i)=>({...z,displayOrder:z.displayOrder??i+1,items:[...(z.items||[])]})));
  const [zoneMsg,setZoneMsg]=useState("");
  const zoneListRef=useRef(null);
  const updateZone=(idx,fields)=>setZoneDraft(p=>p.map((z,i)=>i===idx?{...z,...fields}:z));
  const updateCheck=(zIdx,itemIdx,value)=>setZoneDraft(p=>p.map((z,i)=>i===zIdx?{...z,items:z.items.map((it,j)=>j===itemIdx?value:it)}:z));
  const moveCheck=(zIdx,itemIdx,dir)=>setZoneDraft(p=>p.map((z,i)=>{
    if(i!==zIdx)return z;
    const items=[...z.items];const next=itemIdx+dir;
    if(next<0||next>=items.length)return z;
    [items[itemIdx],items[next]]=[items[next],items[itemIdx]];
    return {...z,items};
  }));
  const addZone=()=>{
    setZoneDraft(p=>[...p,{id:`Z${String(p.length+1).padStart(2,"0")}`,name:"New Zone",items:["General condition OK"],displayOrder:p.length+1}]);
    setTimeout(()=>{
      if(zoneListRef.current){
        const last=zoneListRef.current.lastElementChild;
        if(last)last.scrollIntoView({behavior:"smooth",block:"nearest"});
      }
    },60);
  };
  const removeZone=async(zIdx)=>{
    const z=zoneDraft[zIdx];
    if(!await showConfirm("Remove "+z.id+" · "+z.name+" from active zones? Historical reports will remain available."))return;
    setZoneDraft(p=>p.filter((_,i)=>i!==zIdx));
  };
  const saveZones=async()=>{
    setZoneMsg("Saving zones…");
    try{
      const cleaned=zoneDraft.map((z,i)=>({...z,id:z.id.trim().toUpperCase(),name:z.name.trim(),displayOrder:i+1,items:(z.items||[]).map(x=>x.trim()).filter(Boolean)}));
      await api.put("/api/config/zones",{zones:cleaned});
      setZones(cleaned);
      setZoneDraft(cleaned);
      setZoneMsg("✅ Zones and checks saved.");
    }catch(e){setZoneMsg("❌ "+e.message);}
  };

  // Email
  const [ej,setEj]=useState({...ejConfig});const [ejMsg,setEjMsg]=useState("");
  const saveEj=async()=>{try{await api.put("/api/config",{ejPublicKey:ej.ejPublicKey,ejServiceId:ej.ejServiceId,ejTemplateId:ej.ejTemplateId});setEjConfig(ej);setEjMsg("✅ Saved.");}catch(e){setEjMsg("❌ "+e.message);}};
  const testEj=async()=>{
    const to=authUser.email?.trim();
    if(!to){setEjMsg("⚠ Add an email address to your admin user first.");return;}
    if(!await showConfirm("Send a test email to "+to+"?"))return;
    setEjMsg("Sending test email…");
    const res=await sendEmail(to,authUser.name,"InspectPro test email",{plainText:"InspectPro EmailJS test message.",html:"<p>InspectPro EmailJS test message.</p>"},ej);
    setEjMsg(res.ok?"✅ Test email sent.":`❌ Test email failed: ${res.err||"check config"}`);
  };

  // Telegram
  const [tg,setTg]=useState({...tgConfig});const [tgMsg,setTgMsg]=useState("");
  const saveTg=async()=>{try{await api.put("/api/config",{tgBotToken:tg.tgBotToken,tgChatId:tg.tgChatId});setTgConfig(tg);setTgMsg("✅ Saved.");}catch(e){setTgMsg("❌ "+e.message);}};
  const testTg=async()=>{
    if(!tg.tgBotToken||!tg.tgChatId){setTgMsg("⚠ Bot token and chat ID are required.");return;}
    if(!await showConfirm("Send a test Telegram message to the configured chat?"))return;
    setTgMsg("Sending test Telegram…");
    const res=await notifyTelegram("InspectPro test",`Sent by ${authUser.name} from Admin settings.`,tg);
    setTgMsg(res.ok?"✅ Test Telegram sent.":`❌ Test Telegram failed: ${res.err||"check config"}`);
  };

  // Feedback viewer (admin)
  const [fbList,setFbList]=useState(null);
  const [fbLoading,setFbLoading]=useState(false);
  const loadFeedback=async()=>{
    setFbLoading(true);
    try{const d=await api.get("/api/feedback");setFbList(d);}
    catch(e){showToast("Could not load feedback: "+e.message,"err");}
    setFbLoading(false);
  };
  const deleteFb=async id=>{
    if(!await showConfirm("Delete this feedback entry?"))return;
    try{await api.delete(`/api/feedback/${id}`);setFbList(p=>p.filter(f=>f.id!==id));}
    catch(e){showToast("Delete failed: "+e.message,"err");}
  };

  return <Modal onClose={onClose} title="Menu" maxW={540}>
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",background:"var(--surf)",borderRadius:9,border:"1px solid var(--bd)",marginBottom:16}}>
      <Avatar user={authUser} size={38}/>
      <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,color:"var(--t1)"}}>{authUser.name}</div><Mono size={12}>{authUser.role.toUpperCase()}</Mono></div>
      {isAdmin&&<span style={{fontSize:11,background:"var(--abg)",color:"var(--amber)",padding:"3px 8px",borderRadius:20,fontWeight:600}}>Admin</span>}
    </div>
    <div style={{display:"flex",gap:5,marginBottom:18,flexWrap:"wrap"}}>
      <button onClick={()=>setTab("pin")} style={C.btn(tab==="pin"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>🔑 PIN</button>
      {authUser.role!=="inspector"&&<button onClick={()=>setTab("profile")} style={C.btn(tab==="profile"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>👤 My Profile</button>}
      {isAdmin&&<>
        <button onClick={()=>setTab("team")} style={C.btn(tab==="team"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>👥 Team</button>
        <button onClick={()=>setTab("zones")} style={C.btn(tab==="zones"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>🧭 Zones</button>
        <button onClick={()=>setTab("email")} style={C.btn(tab==="email"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>📧 Email</button>
        <button onClick={()=>setTab("telegram")} style={C.btn(tab==="telegram"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>✈️ Telegram</button>
        <button onClick={()=>{setTab("feedback");if(!fbList)loadFeedback();}} style={C.btn(tab==="feedback"?"pri":"ghost",{padding:"7px 12px",fontSize:13})}>💬 Feedback</button>
      </>}
    </div>

    {tab==="pin"&&<div>
      <div style={{background:"var(--abg)",border:"1px solid var(--abd)",borderRadius:8,padding:"10px 13px",marginBottom:14,fontSize:13,color:"var(--t2)"}}>
        To change your PIN: enter current PIN, then new PIN twice. If you've forgotten your PIN, ask a manager to reset it.
      </div>
      {ps==="done"
        ?<div style={{textAlign:"center",padding:"16px 0"}}><div style={{fontSize:28,marginBottom:10}}>✅</div><div style={{fontWeight:600,color:"var(--t1)",marginBottom:10}}>{pm}</div><button onClick={()=>{setPs("old");setNp("");setPm("");setOldPin("");}} style={C.btn("sec")}>Change again</button></div>
        :pl?<div style={{textAlign:"center",padding:"20px"}}><Spinner size={20}/></div>
          :<PinPad onComplete={ps==="old"?handleOld:ps==="new"?handleNew:handleConf} label={ps==="old"?"Current PIN":ps==="new"?"New PIN (6 digits)":"Confirm new PIN"} error={pm}/>
      }
    </div>}

    {tab==="profile"&&<div>
      <div style={{background:"var(--abg)",border:"1px solid var(--abd)",borderRadius:8,padding:"10px 13px",marginBottom:14,fontSize:13,color:"var(--t2)",lineHeight:1.5}}>
        Inspection reports are emailed to your address and to all managers. Keep this up to date so you receive your own copies.
      </div>
      <Lbl>My Email Address</Lbl>
      <input type="email" value={myEmail} onChange={e=>setMyEmail(e.target.value)} placeholder="you@example.com" style={C.inp({marginBottom:10})}/>
      {emailMsg&&<div style={{padding:"8px 12px",borderRadius:7,fontSize:13,marginBottom:10,background:emailMsg.startsWith("✅")?"var(--cl-bg)":"var(--op-bg)",color:emailMsg.startsWith("✅")?"var(--cl-fg)":"var(--op-fg)"}}>{emailMsg}</div>}
      <button onClick={saveMyEmail} style={C.btn("pri",{width:"100%",padding:"10px"})}>Save Email</button>
      <p style={{fontSize:12,color:"var(--t3)",marginTop:10,lineHeight:1.5}}>Your email is used to receive your own inspection reports. Managers and admins always receive copies regardless.</p>
    </div>}

    {tab==="team"&&<div>
      <ErrBox msg={userErr}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <span style={{fontWeight:600,fontSize:15,color:"var(--t1)"}}>{users.length} members</span>
        <button onClick={()=>setAddingUser(true)} style={C.btn("pri",{padding:"6px 13px",fontSize:13})}>+ Add</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:340,overflowY:"auto"}}>
        {users.map(u=>(editingUser?.id===u.id
          ?<div key={u.id} style={{background:"var(--surf)",border:"1px solid var(--blue)",borderRadius:10,padding:"13px 14px"}}>
            <Lbl>Name</Lbl><input value={editingUser.name} onChange={e=>setEditingUser(p=>({...p,name:e.target.value}))} style={C.inp({marginBottom:8})}/>
            <Lbl>Email</Lbl><input type="email" value={editingUser.email||""} onChange={e=>setEditingUser(p=>({...p,email:e.target.value}))} style={C.inp({marginBottom:8})}/>
            <Lbl>Role</Lbl>
            <select value={editingUser.role} onChange={e=>setEditingUser(p=>({...p,role:e.target.value}))} style={C.inp({marginBottom:8})}>
              <option value="inspector">Inspector</option><option value="manager">Manager</option><option value="admin">Admin</option>
            </select>
            <Lbl>Colour</Lbl>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>{USER_COLORS.map(c=><button key={c} onClick={()=>setEditingUser(p=>({...p,color:c}))} style={{width:24,height:24,minWidth:24,borderRadius:"50%",background:c,border:editingUser.color===c?"3px solid var(--t1)":"2px solid transparent",cursor:"pointer",padding:0,flexShrink:0}}/>)}</div>
            <div style={{display:"flex",gap:7}}><button onClick={()=>saveUserEdit(u.id,editingUser)} style={C.btn("pri",{flex:1,padding:"8px"})}>Save</button><button onClick={()=>setEditingUser(null)} style={C.btn("ghost",{padding:"8px 12px"})}>Cancel</button></div>
          </div>
          :<div key={u.id} style={{display:"flex",alignItems:"center",gap:10,background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:10,padding:"10px 13px"}}>
            <Avatar user={u} size={34}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:2}}>
                <div style={{fontWeight:600,fontSize:14,color:"var(--t1)"}}>{u.name}</div>
                <span style={{...roleChipStyle(u.role),borderRadius:5,padding:"1px 7px",fontSize:11,fontWeight:700,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{u.role.toUpperCase()}</span>
              </div>
              {u.email&&<Mono size={11} style={{display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email}</Mono>}
            </div>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              <button onClick={()=>setEditingUser({...u})} style={C.btn("ghost",{padding:"4px 9px",fontSize:12})}>Edit</button>
              <button onClick={()=>resetPin(u.id)} style={C.btn("sec",{padding:"4px 9px",fontSize:12})}>↺ PIN</button>
              {u.id!==authUser.id&&<button onClick={()=>removeUser(u.id)} style={C.btn("dng",{padding:"4px 8px",fontSize:12})}>✕</button>}
            </div>
          </div>
        ))}
      </div>
      <p style={{fontSize:12,color:"var(--t3)",marginTop:8}}>New members get PIN 123456. They should change on first login.</p>
      {addingUser&&<div style={{marginTop:12,background:"var(--surf)",border:"1px solid var(--green)33",borderRadius:10,padding:"13px"}}>
        <div style={{fontWeight:600,fontSize:14,color:"var(--t1)",marginBottom:11}}>New Team Member</div>
        <Lbl>Name</Lbl><input value={newUser.name} onChange={e=>setNewUser(p=>({...p,name:e.target.value}))} placeholder="Full name" style={C.inp({marginBottom:8})}/>
        <Lbl>Email</Lbl><input type="email" value={newUser.email} onChange={e=>setNewUser(p=>({...p,email:e.target.value}))} placeholder="name@example.com" style={C.inp({marginBottom:8})}/>
        <Lbl>Role</Lbl>
        <select value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value}))} style={C.inp({marginBottom:8})}><option value="inspector">Inspector</option><option value="manager">Manager</option><option value="admin">Admin</option></select>
        <Lbl>Colour</Lbl>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>{USER_COLORS.map(c=><button key={c} onClick={()=>setNewUser(p=>({...p,color:c}))} style={{width:24,height:24,minWidth:24,borderRadius:"50%",background:c,border:newUser.color===c?"3px solid var(--t1)":"2px solid transparent",cursor:"pointer",padding:0,flexShrink:0}}/>)}</div>
        <div style={{display:"flex",gap:7}}><button onClick={addUser} disabled={!newUser.name.trim()} style={{...C.btn("pri",{flex:1,padding:"9px"}),opacity:newUser.name.trim()?1:.35}}>Add</button><button onClick={()=>setAddingUser(false)} style={C.btn("ghost",{padding:"9px 12px"})}>Cancel</button></div>
      </div>}
    </div>}

    {tab==="zones"&&<div>
      {zoneMsg&&<div style={{padding:"8px 12px",borderRadius:7,fontSize:13,marginBottom:10,background:zoneMsg.startsWith("✅")?"var(--cl-bg)":"var(--ip-bg)",color:zoneMsg.startsWith("✅")?"var(--cl-fg)":"var(--ip-fg)"}}>{zoneMsg}</div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontWeight:700,color:"var(--t1)"}}>Zones and check sequence</span>
        <button onClick={addZone} style={C.btn("sec",{padding:"7px 12px",fontSize:13})}>+ Zone</button>
      </div>
      <div ref={zoneListRef} style={{display:"flex",flexDirection:"column",gap:10,maxHeight:430,overflowY:"auto",paddingRight:4}}>
        {zoneDraft.map((z,zIdx)=><div key={zIdx} style={{background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:10,padding:"12px"}}>
          <div style={{display:"grid",gridTemplateColumns:"82px 1fr auto",gap:8,marginBottom:10,alignItems:"center"}}>
            <input value={z.id} onChange={e=>updateZone(zIdx,{id:e.target.value})} style={C.inp({fontFamily:"'DM Mono',monospace",fontWeight:700})}/>
            <input value={z.name} onChange={e=>updateZone(zIdx,{name:e.target.value})} style={C.inp({fontWeight:700})}/>
            <button onClick={()=>removeZone(zIdx)} style={C.btn("dng",{padding:"7px 10px",fontSize:13})}>Remove</button>
          </div>
          <Lbl>Checks, in order</Lbl>
          {(z.items||[]).map((item,itemIdx)=><div key={itemIdx} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
            <Mono size={12} style={{width:22,textAlign:"right"}}>{itemIdx+1}</Mono>
            <input value={item} onChange={e=>updateCheck(zIdx,itemIdx,e.target.value)} style={C.inp({flex:1})}/>
            <button onClick={()=>moveCheck(zIdx,itemIdx,-1)} style={C.btn("ghost",{padding:"4px 8px",fontSize:12})}>↑</button>
            <button onClick={()=>moveCheck(zIdx,itemIdx,1)} style={C.btn("ghost",{padding:"4px 8px",fontSize:12})}>↓</button>
            <button onClick={()=>updateZone(zIdx,{items:z.items.filter((_,i)=>i!==itemIdx)})} style={C.btn("dng",{padding:"4px 8px",fontSize:12})}>✕</button>
          </div>)}
          <button onClick={()=>updateZone(zIdx,{items:[...(z.items||[]),"New check item"]})} style={C.btn("ghost",{padding:"7px 10px",fontSize:13,marginTop:4})}>+ Check</button>
        </div>)}
      </div>
      <button onClick={saveZones} style={C.btn("pri",{width:"100%",marginTop:12,padding:"11px"})}>Save Zones</button>
      <p style={{fontSize:12,color:"var(--t3)",marginTop:8,lineHeight:1.5}}>Changes apply to future inspections. Existing submitted reports keep their original checklist records.</p>
    </div>}

    {tab==="email"&&<div style={{display:"flex",flexDirection:"column",gap:11}}>
      <div><Lbl>EmailJS Public Key</Lbl><input value={ej.ejPublicKey||""} onChange={e=>setEj(c=>({...c,ejPublicKey:e.target.value.trim()}))} style={C.inp({fontFamily:"'DM Mono',monospace",fontSize:13})}/></div>
      <div><Lbl>Service ID</Lbl><input value={ej.ejServiceId||""} onChange={e=>setEj(c=>({...c,ejServiceId:e.target.value.trim()}))} style={C.inp({fontFamily:"'DM Mono',monospace",fontSize:13})}/></div>
      <div><Lbl>Template ID</Lbl><input value={ej.ejTemplateId||""} onChange={e=>setEj(c=>({...c,ejTemplateId:e.target.value.trim()}))} style={C.inp({fontFamily:"'DM Mono',monospace",fontSize:13})}/></div>
      {ejMsg&&<div style={{padding:"8px 12px",borderRadius:7,fontSize:13,background:ejMsg.startsWith("✅")?"var(--cl-bg)":"var(--op-bg)",color:ejMsg.startsWith("✅")?"var(--cl-fg)":"var(--op-fg)"}}>{ejMsg}</div>}
      <div style={{display:"flex",gap:8}}>
        <button onClick={saveEj} style={C.btn("pri",{padding:"9px",flex:1})}>💾 Save</button>
        <button onClick={testEj} style={C.btn("sec",{padding:"9px",flex:1})}>Send Test</button>
      </div>
      <p style={{fontSize:12,color:"var(--t3)"}}>Only admins can view or edit these settings.</p>
    </div>}

    {tab==="telegram"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:"var(--bbg)",border:"1px solid var(--blue)22",borderRadius:8,padding:"11px 13px",fontSize:13,color:"var(--t2)",lineHeight:1.6}}>
        <strong style={{color:"var(--t1)"}}>Setup: Group Chat notifications</strong><br/>
        1. Create a Telegram group and add all managers to it.<br/>
        2. Add your bot to the group and promote it to admin (so it can post).<br/>
        3. Send any message in the group, then visit:<br/>
        <Mono size={12} style={{display:"block",wordBreak:"break-all",marginTop:3}}>https://api.telegram.org/bot&lt;TOKEN&gt;/getUpdates</Mono>
        4. Find the <Mono size={12}>chat.id</Mono> value (starts with <Mono size={12}>-100</Mono> for groups) and paste it below.
      </div>
      <div><Lbl>Bot Token</Lbl><input value={tg.tgBotToken||""} onChange={e=>setTg(c=>({...c,tgBotToken:e.target.value.trim()}))} placeholder="1234567890:AABBccDDeeff..." style={C.inp({fontFamily:"'DM Mono',monospace",fontSize:13})}/></div>
      <div><Lbl>Group Chat ID</Lbl><input value={tg.tgChatId||""} onChange={e=>setTg(c=>({...c,tgChatId:e.target.value.trim()}))} placeholder="-100xxxxxxxxxx" style={C.inp({fontFamily:"'DM Mono',monospace",fontSize:13})}/></div>
      {tgMsg&&<div style={{padding:"8px 12px",borderRadius:7,fontSize:13,background:tgMsg.startsWith("✅")?"var(--cl-bg)":"var(--op-bg)",color:tgMsg.startsWith("✅")?"var(--cl-fg)":"var(--op-fg)"}}>{tgMsg}</div>}
      <div style={{display:"flex",gap:8}}>
        <button onClick={saveTg} style={C.btn("pri",{padding:"9px",flex:1})}>💾 Save</button>
        <button onClick={testTg} style={C.btn("sec",{padding:"9px",flex:1})}>Send Test</button>
      </div>
      <p style={{fontSize:12,color:"var(--t3)"}}>All inspection completion alerts go to this group. Every manager in the group sees them in real time.</p>
    </div>}

    {tab==="feedback"&&<div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <span style={{fontWeight:700,fontSize:15,color:"var(--t1)"}}>Pilot Feedback</span>
        <button onClick={loadFeedback} style={C.btn("ghost",{padding:"6px 12px",fontSize:12})}>↻ Refresh</button>
      </div>
      {fbLoading?<div style={{textAlign:"center",padding:24}}><Spinner size={20}/></div>
        :!fbList||fbList.length===0
          ?<div style={{textAlign:"center",padding:"32px",color:"var(--t3)",fontSize:14,background:"var(--surf)",borderRadius:9,border:"1px solid var(--bd)"}}>No feedback submitted yet.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:400,overflowY:"auto"}}>
            {fbList.map(f=><div key={f.id} style={{background:"var(--surf)",border:"1px solid var(--bd)",borderRadius:10,padding:"12px 14px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}>
                <span style={{...roleChipStyle(f.user_role),borderRadius:5,padding:"1px 7px",fontSize:11,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{f.user_role.toUpperCase()}</span>
                <span style={{fontWeight:600,fontSize:13,color:"var(--t1)"}}>{f.user_name}</span>
                <Mono size={11} style={{marginLeft:"auto"}}>{fD(f.created_at)} {fT(f.created_at)}</Mono>
              </div>
              <div style={{fontSize:14,color:"var(--t2)",lineHeight:1.6,marginBottom:f.photo_url?10:0}}>{f.text}</div>
              {f.photo_url&&<img src={f.thumbnail_url||f.photo_url} style={{width:80,height:80,objectFit:"cover",borderRadius:7,border:"1px solid var(--bd)",cursor:"zoom-in"}} onClick={()=>window.open(f.photo_url,"_blank")}/>}
              <div style={{marginTop:9,display:"flex",justifyContent:"flex-end"}}>
                <button onClick={()=>deleteFb(f.id)} style={C.btn("dng",{padding:"4px 9px",fontSize:12})}>✕ Delete</button>
              </div>
            </div>)}
          </div>
      }
    </div>}
  </Modal>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const saved=LS.load("ip_v4_prefs");
  const [authUser,setAuthUser]=useState(()=>LS.load("ip_v4_user"));
  const [users,setUsers]=useState([]);
  const [zones,setZones]=useState([]);
  const [theme,setTheme]=useState(saved?.theme||"dark");
  const [view,setView]=useState("home");
  const [showLogin,setShowLogin]=useState(()=>!LS.load("ip_v4_user"));
  const [showAdmin,setShowAdmin]=useState(false);
  const [showFeedback,setShowFeedback]=useState(false);
  const [isOnline,setIsOnline]=useState(navigator.onLine);
  const [serverWaking,setServerWaking]=useState(false);
  const [updateReady,setUpdateReady]=useState(false);
  const [ejConfig,setEjConfig]=useState({});
  const [tgConfig,setTgConfig]=useState({});
  const [bootstrapErr,setBootstrapErr]=useState("");
  const today=new Date();

  // Persist prefs
  useEffect(()=>{ LS.save("ip_v4_prefs",{theme}); },[theme]);
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); },[theme]);
  useEffect(()=>{
    document.documentElement.style.fontSize="17px";
    document.body.style.zoom=1;
  },[]);
  useEffect(()=>{ if(authUser) LS.save("ip_v4_user",authUser); else localStorage.removeItem("ip_v4_user"); },[authUser]);

  // Online/offline detection
  useEffect(()=>{
    const on=()=>setIsOnline(true);const off=()=>setIsOnline(false);
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);

  // Server cold-start banner
  useEffect(()=>{
    const show=()=>setServerWaking(true);
    const hide=()=>setServerWaking(false);
    window.addEventListener("ip_server_waking",show);
    window.addEventListener("ip_server_ready",hide);
    return()=>{window.removeEventListener("ip_server_waking",show);window.removeEventListener("ip_server_ready",hide);};
  },[]);

  // SW update ready
  useEffect(()=>{
    const handler=()=>setUpdateReady(true);
    window.addEventListener("ip_update_ready",handler);
    return()=>window.removeEventListener("ip_update_ready",handler);
  },[]);

  // JWT expired — auto-logout
  useEffect(()=>{
    const handler=()=>{setAuthUser(null);localStorage.removeItem("ip_v4_token");setView("home");setShowLogin(true);showToast("Session expired — please sign in again","err");};
    window.addEventListener("ip_auth_expired",handler);
    return()=>window.removeEventListener("ip_auth_expired",handler);
  },[]);

  // Bootstrap: load users + zones on mount
  useEffect(()=>{
    async function bootstrap(){
      try{
        const[u,z]=await Promise.all([api.get("/api/users"),api.get("/api/config/zones")]);
        setUsers(u);setZones(z);
      }catch(e){
        setBootstrapErr("Cannot reach the API server. Check your connection or backend URL.");
      }
      // Load full notification config for admins only.
      if(canManageConfig(authUser)){
        try{const cfg=await api.get("/api/config");setEjConfig(cfg);setTgConfig(cfg);}catch{}
      }
    }
    bootstrap();
  },[authUser?.role]);

  const handleLogin=u=>{setAuthUser(u);setShowLogin(false);};
  const handleLogout=()=>{setAuthUser(null);localStorage.removeItem("ip_v4_token");api.resetAuthExpired();setView("home");setShowLogin(true);};
  const nav=v=>{
    if(v==="reports"&&!canManageOps(authUser))return;
    setView(v);
  };

  // ── Not logged in: show only the login picker, full screen ──────────────────
  if(!authUser){
    return <div style={{fontFamily:"'DM Sans',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--t1)",transition:"background .25s"}}>
      {!isOnline&&<div className="offline-bar">⚠ No internet connection — app requires a live connection</div>}
      {serverWaking&&<div className="waking-bar" style={{top:!isOnline?32:0}}><span className="waking-spinner"/><span>Server is waking up — this takes about 30 seconds on first load. Hang tight!</span></div>}
      {bootstrapErr&&<div style={{position:"fixed",bottom:16,left:16,right:16,padding:"12px 16px",background:"var(--op-bg)",borderRadius:12,color:"var(--op-fg)",fontSize:13,zIndex:600}}>
        ⚠ {bootstrapErr}
      </div>}
      {users.length>0
        ? <LoginModal users={users} onLogin={handleLogin} onClose={null}/>
        : <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
            <div style={{textAlign:"center"}}>
              <div style={{width:44,height:44,background:"var(--amber)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:16,color:"#fff",fontFamily:"'Syne',sans-serif",margin:"0 auto 16px"}}>IP</div>
              <Spinner size={24}/>
              <p style={{marginTop:12,color:"var(--t3)",fontSize:14}}>Connecting…</p>
            </div>
          </div>
      }
      <ToastHost/>
    </div>;
  }

  // ── Logged in ────────────────────────────────────────────────────────────────
  return <div style={{fontFamily:"'DM Sans',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--t1)",transition:"background .25s"}}>
    {updateReady&&<div className="update-bar"><span>🚀 New version available</span><button onClick={()=>window.location.reload()}>Update now</button></div>}
    {!isOnline&&<div className="offline-bar" style={{top:updateReady?32:0}}>⚠ No internet connection — app requires a live connection</div>}
    {serverWaking&&<div className="waking-bar" style={{top:(updateReady&&!isOnline)?64:(updateReady||!isOnline)?32:0}}><span className="waking-spinner"/><span>Server is waking up — this takes about 30 seconds on first load. Hang tight!</span></div>}
    <div style={{marginTop:[updateReady,!isOnline,serverWaking].filter(Boolean).length*32}}>
      <NavBar view={view} nav={nav} authUser={authUser} onSignIn={()=>setShowLogin(true)} onSignOut={handleLogout} theme={theme} setTheme={setTheme} onAdmin={()=>setShowAdmin(true)}/>
      {authUser&&<button onClick={()=>setShowFeedback(true)} style={{position:"fixed",top:56,right:16,zIndex:195,background:"var(--blue)",color:"#fff",border:"none",borderRadius:20,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,.25)",letterSpacing:".01em"}}>💬 Feedback</button>}
      <div className="main-pad" style={{maxWidth:1140,margin:"0 auto"}}>
        {bootstrapErr&&<div style={{padding:"20px",background:"var(--op-bg)",borderRadius:12,color:"var(--op-fg)",marginBottom:16,fontSize:14}}>
          ⚠ {bootstrapErr}<br/><span style={{fontSize:12,opacity:.8}}>API: {API_BASE}</span>
        </div>}
        {view==="home"    &&<HomeView today={today} authUser={authUser} users={users} zones={zones} nav={nav} isOnline={isOnline}/>}
        {view==="inspect" &&<InspectView authUser={authUser} zones={zones} users={users} today={today} ejConfig={ejConfig} tgConfig={tgConfig}/>}
        {view==="tracker" &&<TrackerView authUser={authUser} zones={zones}/>}

        {view==="reports" &&canManageOps(authUser)&&<ReportsView users={users} zones={zones} authUser={authUser}/>}
      </div>
    </div>
    {showAdmin&&<AdminPanel authUser={authUser} users={users} setUsers={setUsers} zones={zones} setZones={setZones} ejConfig={ejConfig} setEjConfig={setEjConfig} tgConfig={tgConfig} setTgConfig={setTgConfig} onClose={()=>setShowAdmin(false)}/>}
    {showFeedback&&<FeedbackModal onClose={()=>setShowFeedback(false)}/>}
    <ToastHost/>
    <ConfirmHost/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    // Flag whether a SW is already controlling this page (i.e. this is an update, not first install)
    const wasControlled=!!navigator.serviceWorker.controller;
    // Listen for the SW_ACTIVATED broadcast — only treat it as an update if we had a prior SW
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='SW_ACTIVATED'&&wasControlled){
        console.log('[SW] new version activated — notifying app');
        window.dispatchEvent(new Event('ip_update_ready'));
      }
    });
    navigator.serviceWorker.register('sw.js')
      .then(r=>console.log('[SW] registered:',r.scope))
      .catch(e=>console.warn('[SW] failed:',e));
  });
}
</script>
</body>
</html>

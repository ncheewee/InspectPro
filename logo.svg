<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon background: deep navy rounded square -->
  <rect width="512" height="512" rx="96" fill="#0D2461"/>

  <!-- Building body -->
  <rect x="136" y="148" width="210" height="248" rx="6" fill="#1B3A8C"/>
  <!-- Building facade highlights -->
  <rect x="136" y="148" width="210" height="16" rx="3" fill="#2448B0"/>

  <!-- Window grid — left column -->
  <rect x="158" y="188" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="158" y="232" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="158" y="276" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="158" y="320" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.55"/>

  <!-- Window grid — centre column -->
  <rect x="220" y="188" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="220" y="232" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="220" y="276" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="220" y="320" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.55"/>

  <!-- Window grid — right column -->
  <rect x="282" y="188" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="282" y="232" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="282" y="276" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.7"/>
  <rect x="282" y="320" width="36" height="28" rx="4" fill="#2E5BCC" opacity="0.55"/>

  <!-- Entrance door -->
  <rect x="218" y="356" width="44" height="40" rx="3" fill="#0D2461"/>

  <!-- Ground line -->
  <rect x="110" y="396" width="262" height="6" rx="3" fill="#1B3A8C"/>

  <!-- Amber magnifying glass — overlapping bottom-right of building -->
  <!-- Drop shadow -->
  <circle cx="330" cy="338" r="72" fill="#0D2461" opacity="0.5"/>
  <!-- Glass ring -->
  <circle cx="326" cy="334" r="72" fill="#F59E0B"/>
  <circle cx="326" cy="334" r="54" fill="#0D2461"/>
  <!-- Inner lens highlight -->
  <circle cx="326" cy="334" r="54" fill="#1B3A8C" opacity="0.6"/>
  <!-- Lens shine -->
  <circle cx="310" cy="318" r="14" fill="white" opacity="0.12"/>

  <!-- Checkmark inside lens (white) -->
  <polyline points="303,334 320,351 355,316" fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying glass handle -->
  <line x1="367" y1="375" x2="400" y2="408" stroke="#F59E0B" stroke-width="22" stroke-linecap="round"/>
</svg>
